function handleLogoUpload(input){
  // Solo genera una vista previa; el logo no se guarda hasta que se confirme
  // con el botón "Guardar logo" (así, si te equivocas de archivo, el logo
  // insertado no se pierde mientras no confirmes el cambio).
  const file = input.files && input.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('Selecciona un archivo de imagen.'); return; }
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxDim = 240;
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
      else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      window._pendingLogo = canvas.toDataURL('image/png');
      const wrap = document.getElementById('logoPreviewWrap');
      if(wrap) wrap.innerHTML = `<img class="img-preview" src="${window._pendingLogo}">`;
      const btnWrap = document.getElementById('logoSaveBtnWrap');
      if(btnWrap) btnWrap.style.display = '';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
async function saveLogo(){
  if(!window._pendingLogo){ showToast('Primero selecciona una imagen.'); return; }
  DB.settings.logo = window._pendingLogo;
  window._pendingLogo = null;
  await save('settings');
  applyBrandMark();
  showToast('Logo guardado.');
  render();
}
function cancelLogoPreview(){
  window._pendingLogo = null;
  render();
}
async function clearLogo(){
  DB.settings.logo = '';
  window._pendingLogo = null;
  await save('settings');
  applyBrandMark();
  render();
}
function applyBrandMark(){
  const el = document.getElementById('brandMark');
  if(el){
    if(DB.settings.logo){
      el.style.background = 'none';
      el.innerHTML = `<img src="${DB.settings.logo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
    } else {
      el.style.background = 'linear-gradient(145deg,var(--brass),var(--pine))';
      el.textContent = 'W';
    }
  }
  // Icono de la pestaña del navegador — usa el mismo logo de la empresa. Si
  // todavía no hay logo cargado, no se toca (se queda el ícono por default).
  if(DB.settings.logo){
    let favicon = document.querySelector('link[rel="icon"]');
    if(!favicon){
      favicon = document.createElement('link');
      favicon.rel = 'icon';
      document.head.appendChild(favicon);
    }
    favicon.href = DB.settings.logo;
  }
}
async function addUser(){
  const name = document.getElementById('u_name').value.trim();
  const email = document.getElementById('u_email').value.trim();
  const pass = document.getElementById('u_pass').value.trim();
  if(!name || !pass){ showToast('Captura al menos el nombre y la contraseña.'); return; }
  if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showToast('Revisa el correo: no tiene un formato válido.'); return; }
  DB.settings.users = DB.settings.users || [];
  if(email && DB.settings.users.some(u=> norm(u.email) === norm(email))){ showToast('Ese correo ya está asignado a otro usuario.'); return; }
  DB.settings.users.push({ name, email, pass, role: document.getElementById('u_role').value });
  await save('settings');
  await logAction('crear', 'usuario', name, null, { name, email, role: document.getElementById('u_role').value });
  showToast('Usuario agregado: ' + name);
  render();
}
function editUser(i){
  const u = (DB.settings.users||[])[i];
  if(!u) return;
  openModal(`
    <h2>Editar usuario</h2>
    <div class="modal-sub">El correo es con el que esta persona inicia sesión. Su nombre es el que aparece en el sistema y en la bitácora.</div>
    <div class="field-grid">
      <div class="field"><label>Nombre</label><input id="eu_name" value="${escapeAttr(u.name)}"></div>
      <div class="field"><label>Correo de acceso</label><input id="eu_email" type="email" value="${escapeAttr(u.email||'')}" placeholder="correo@ejemplo.com"></div>
      <div class="field"><label>Contraseña</label><input id="eu_pass" value="${escapeAttr(u.pass||'')}"></div>
      <div class="field"><label>Rol</label>
        <select id="eu_role">
          ${ROLE_NAMES.map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn brass" onclick="saveUser(${i})">Guardar cambios</button>
    </div>
  `);
}
async function saveUser(i){
  const u = (DB.settings.users||[])[i];
  if(!u) return;
  const name = document.getElementById('eu_name').value.trim();
  const email = document.getElementById('eu_email').value.trim();
  const pass = document.getElementById('eu_pass').value.trim();
  if(!name || !pass){ showToast('El nombre y la contraseña son obligatorios.'); return; }
  if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showToast('Revisa el correo: no tiene un formato válido.'); return; }
  if(email && DB.settings.users.some((x,j)=> j!==i && norm(x.email) === norm(email))){ showToast('Ese correo ya está asignado a otro usuario.'); return; }
  const before = {...u};
  Object.assign(u, { name, email, pass, role: document.getElementById('eu_role').value });
  await save('settings');
  await logAction('editar', 'usuario', name, before, u);
  closeModal();
  showToast('Usuario actualizado.');
  render();
}
async function removeUser(i){
  if(!guardPerm('administracion', 'gestionar usuarios')) return;
  const u = (DB.settings.users||[])[i];
  if(!u) return;
  const tieneAdmin = (role)=> !!((DB.settings.rolePerms && DB.settings.rolePerms[role] && DB.settings.rolePerms[role].administracion) || (DEFAULT_ROLE_PERMS[role] && DEFAULT_ROLE_PERMS[role].administracion));
  if((DB.settings.users||[]).filter(x=>tieneAdmin(x.role)).length <= 1 && tieneAdmin(u.role)){
    showToast('No se puede quitar al último usuario con acceso a Administración.');
    return;
  }
  if(!confirm(`¿Quitar a ${u.name} del sistema?`)) return;
  DB.settings.users.splice(i,1);
  await save('settings');
  await logAction('eliminar', 'usuario', u.name, u, null);
  render();
}
async function saveRolePerms(){
  if(!guardPerm('administracion', 'gestionar roles y permisos')) return;
  const before = JSON.parse(JSON.stringify(DB.settings.rolePerms||{}));
  ROLE_NAMES.forEach(r=>{
    if(r==='Administrador') return; // el rol Administrador siempre mantiene todo, no se lee de la casilla (está deshabilitada).
    DB.settings.rolePerms[r] = DB.settings.rolePerms[r] || {};
    PERM_DEFS.forEach(p=>{
      const el = document.getElementById(`rp_${r}_${p.key}`);
      if(el) DB.settings.rolePerms[r][p.key] = el.checked;
    });
  });
  await save('settings');
  await logAction('editar', 'permisos', 'Roles y permisos', before, DB.settings.rolePerms);
  showToast('Permisos actualizados.');
  render();
}
function exportFullBackupExcel(){
  if(!window.XLSX){ showToast('El generador de Excel no cargó. Intenta de nuevo.'); return; }
  const wb = XLSX.utils.book_new();
  const sheets = {
    'Clientes': DB.clients, 'Catalogo': DB.models.map(m=>({name:m.name,cost:m.cost,price:m.price,colors:(m.colors||[]).join(', '),sizes:(m.sizes||[]).join(', '),active:m.active})),
    'Pedidos': DB.orders.map(o=>({folio:o.folio, fecha:o.date, cliente:clientName(o.clientId), total:orderTotal(o), cobrado:orderPaid(o), estado:orderStatus(o)})),
    'Pagos': DB.payments, 'Embarques': DB.shipments, 'Bitacora': DB.logEntries
  };
  Object.entries(sheets).forEach(([name, rows])=>{
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));
  });
  XLSX.writeFile(wb, `Respaldo_SandaliasWiss_${todayStr()}.xlsx`);
  showToast('Respaldo descargado.');
}


(async function init(){
  await loadAll();
  // seedModelsIfEmpty() y seedClientsIfEmpty() ya NO se llaman aquí: tanto el
  // catálogo como los clientes viven en Supabase y las reglas de seguridad no
  // dejan verlos ni crearlos sin sesión. Se llaman en su lugar justo después
  // del login, en loadCurrentUserProfile().
  seedUsersIfEmpty();
  seedRolePermsIfEmpty();
  await save('settings');
  // Si ya había una sesión abierta de Supabase (por ejemplo, se recargó la
  // página), se entra directo sin pedir el correo/contraseña otra vez.
  let yaEntro = false;
  if(sbClient){
    const { data } = await sbClient.auth.getSession();
    if(data && data.session && data.session.user){
      render(); // pinta el fondo antes de mostrar el sistema
      await loadCurrentUserProfile(data.session.user);
      yaEntro = true;
    }
  }
  if(!yaEntro){
    showLoginScreen();
    render();
  }
})();
</script>
