    ${o.versions && o.versions.length ? `<div class="hint">Este pedido tiene ${o.versions.length} versión(es) anterior(es) guardadas en el historial.</div>` : ''}

    <div class="modal-actions" style="flex-wrap:wrap;">
      <button class="btn ghost" onclick="closeModal()">Cerrar</button>
      <button class="btn ghost" onclick="closeModal(); openOrderForm('${o.id}')">Editar</button>
      <button class="btn ghost" onclick="closeModal(); openPaymentForm('${o.id}')">+ Pago</button>
      <button class="btn ghost" onclick="closeModal(); openShipmentForm('${o.id}')">+ Embarque</button>
      <button class="btn ghost" onclick="toggleCancelOrder('${o.id}')">${o.cancelled?'Reactivar pedido':'Cancelar pedido'}</button>
      <button class="btn danger" onclick="deleteOrder('${o.id}')">Eliminar pedido</button>
      <label style="font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;"><input type="checkbox" id="pdfIvaCheck_${o.id}" ${(o.pdfShowIva!==null && o.pdfShowIva!==undefined ? o.pdfShowIva : !!o.ivaApplied)?'checked':''}> Desglosar IVA</label>
      <label style="font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;"><input type="checkbox" id="pdfPromoCheck_${o.id}" ${o.pdfShowPromos?'checked':''}> Mostrar descuentos/promos</label>
      <button class="btn ghost sm" onclick="savePdfPreference('${o.id}')" title="Recuerda estas casillas la próxima vez que abras este pedido">💾 Guardar preferencia</button>
      <button class="btn brass" onclick="generateOrderPDF('${o.id}', document.getElementById('pdfIvaCheck_${o.id}').checked, document.getElementById('pdfPromoCheck_${o.id}').checked)">Descargar PDF</button>
    </div>
  `, true);
}

/* ================= PDF DEL PEDIDO / COTIZACIÓN =================
   Reestructurado: tabla compacta, con líneas de cuadrícula reales, texto
   recortado al ancho de su columna (ya no se encima), encabezado repetido en
   cada página y bloque de totales que nunca se traslapa con el pie de página. */

// Recorta un texto para que quepa exactamente en el ancho disponible.
function fitText(doc, text, maxW){
  let s = String(text == null ? '' : text);
  if(doc.getTextWidth(s) <= maxW) return s;
  while(s.length > 1 && doc.getTextWidth(s + '…') > maxW) s = s.slice(0, -1);
  return s + '…';
}

// Agrupa por modelo + color + promoción, de modo que una promo 2x1 o una
// reposición nunca se mezclen en el mismo renglón con producto de precio normal.
function groupOrderItemsForPDF(items){
  const groups = {};
  const order = [];
  (items||[]).forEach(it=>{
    const key = [it.modelId||'', it.color||'', it.itemDiscount||0, it.isReturn?'R':'N', it.price||0].join('||');
    if(!groups[key]){
      groups[key] = {
        modelId: it.modelId, color: it.color||'', sizes:{},
        price: Number(it.price)||0, promo: Number(it.itemDiscount)||0,
        isReturn: !!it.isReturn, promoLabel: it.promoLabel||'', promoTipo: it.promoTipo||''
      };
      order.push(key);
    }
    const g = groups[key];
    const sizeKey = it.size || '—';
    g.sizes[sizeKey] = (g.sizes[sizeKey]||0) + Math.abs(Number(it.qty||0));
  });
  return order.map(k=>groups[k]);
}

function promoTextForPDF(g){
  if(g.isReturn) return 'Reposición';
  if(!g.promo) return '—';
  if(g.promoTipo === '2x1' || g.promo === 50) return '2x1';
  return g.promo + '%';
}

function generateOrderPDF(id, showIVA, showPromos){
  const o = DB.orders.find(x=>x.id===id);
  if(!o || !window.jspdf){ showToast('El generador de PDF no cargó. Intenta de nuevo.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
  const PAGE_W = 210, PAGE_H = 297;    // vertical: más fácil de imprimir/guardar tal cual
  const M = 9;                     // margen izquierdo/derecho del contenido (más angosto que antes)
  const CELL_PAD = 2.6;            // aire interno de cada celda
  const ROW_H = 8.4;               // alto de renglón: espacioso y fácil de leer
  const HEAD_H = 14.6;             // encabezado más alto: ahora lleva ícono + etiqueta de 2 líneas
  const ICON_W = 2;                // pequeño respiro a la izquierda del modelo (ya sin ícono)

  /* ---------- paleta: todo en tonos rosas + acentos dorados ---------- */
  const CREAM      = [253,248,245];
  const ROSE_TITLE = [196,120,140];
  const ROSE_DARK  = [146,32,73];
  const ROSE_TEXT  = [110,15,55];
  const GOLD       = [196,160,90];
  const INK        = [55,35,45];
  const SOFT_PINK  = [250,227,236];
  const PALE_PINK  = [255,246,250];
  // Rosa MUY atenuado para las columnas Total pares / Precio unitario /
  // Subtotal: antes era un rosa fuerte tipo fiusha que se veía pesado; ahora
  // es un tono suave, acorde con el resto de la paleta.
  const STRONG_PINK= [250,236,242];
  const CARD_LINE  = [232,206,217];

  /* ---------- iconos propios (vectores simples, sin imágenes externas) ---------- */
  function ic(){ doc.setDrawColor(ROSE_DARK[0],ROSE_DARK[1],ROSE_DARK[2]); doc.setLineWidth(0.55); }
  function icWhite(){ doc.setDrawColor(255,255,255); doc.setLineWidth(0.55); }
  function iconClipboard(cx,cy,s,white){ white?icWhite():ic();
    doc.roundedRect(cx-s*0.34, cy-s*0.42, s*0.68, s*0.86, 0.7,0.7,'S');
    doc.roundedRect(cx-s*0.14, cy-s*0.52, s*0.28, s*0.16, 0.4,0.4,'S');
    doc.line(cx-s*0.18, cy-s*0.06, cx+s*0.18, cy-s*0.06);
    doc.line(cx-s*0.18, cy+s*0.14, cx+s*0.18, cy+s*0.14);
  }
  function iconPerson(cx,cy,s,white){ white?icWhite():ic();
    doc.circle(cx, cy-s*0.22, s*0.2, 'S');
    doc.roundedRect(cx-s*0.3, cy+s*0.0, s*0.6, s*0.4, s*0.28, s*0.28, 'S');
  }
  function iconCalendar(cx,cy,s,white){ white?icWhite():ic();
    doc.roundedRect(cx-s*0.38, cy-s*0.3, s*0.76, s*0.64, 0.7,0.7,'S');
    doc.line(cx-s*0.38, cy-s*0.08, cx+s*0.38, cy-s*0.08);
    doc.line(cx-s*0.16, cy-s*0.4, cx-s*0.16, cy-s*0.2);
    doc.line(cx+s*0.16, cy-s*0.4, cx+s*0.16, cy-s*0.2);
  }
  function iconBox(cx,cy,s,white){ white?icWhite():ic();
    doc.roundedRect(cx-s*0.36, cy-s*0.28, s*0.72, s*0.56, 0.7,0.7,'S');
    doc.line(cx-s*0.36, cy, cx+s*0.36, cy);
    doc.line(cx, cy-s*0.28, cx, cy);
  }
  function iconBag(cx,cy,s,white){ white?icWhite():ic();
    doc.roundedRect(cx-s*0.34, cy-s*0.1, s*0.68, s*0.5, 0.9,0.9,'S');
    doc.line(cx-s*0.16, cy-s*0.1, cx-s*0.16, cy-s*0.28);
    doc.line(cx+s*0.16, cy-s*0.1, cx+s*0.16, cy-s*0.28);
    doc.line(cx-s*0.16, cy-s*0.28, cx+s*0.16, cy-s*0.28);
  }
  // El ícono de zapato dibujado con figuras básicas no se leía bien a tamaño
  // pequeño (se veía como un garabato); en vez de eso se usa un rombo
  // decorativo sencillo, que sí se ve limpio en cualquier tamaño.
  // Sandalia de tacón estilizada (silueta simple con líneas y óvalos, igual
  // de sencilla que el resto de los íconos de esta plantilla) — se usa junto
  // al nombre del modelo en cada renglón, y en blanco dentro del encabezado
  // de la columna "Total pares", tal como en la plantilla de referencia.
  function iconSandal(cx,cy,s,white){
    white?icWhite():ic();
    doc.setLineWidth(0.32);
    doc.line(cx-s*0.48, cy+s*0.30, cx-s*0.02, cy+s*0.20);
    doc.line(cx-s*0.02, cy+s*0.20, cx+s*0.32, cy+s*0.05);
    doc.line(cx+s*0.32, cy+s*0.05, cx+s*0.37, cy-s*0.32);
    doc.line(cx+s*0.37, cy-s*0.32, cx+s*0.20, cy-s*0.32);
    doc.line(cx+s*0.20, cy-s*0.32, cx+s*0.10, cy+s*0.10);
    doc.ellipse(cx-s*0.28, cy-s*0.02, s*0.13, s*0.19, 'S');
    doc.ellipse(cx+s*0.00, cy-s*0.14, s*0.19, s*0.25, 'S');
  }
  function iconDiamond(cx,cy,s,color){
    doc.setFillColor(color[0],color[1],color[2]);
    doc.triangle(cx, cy-s*0.3, cx+s*0.22, cy, cx, cy+s*0.3, 'F');
    doc.triangle(cx, cy-s*0.3, cx-s*0.22, cy, cx, cy+s*0.3, 'F');
  }
  function iconTag(cx,cy,s,white){ white?icWhite():ic();
    doc.roundedRect(cx-s*0.3, cy-s*0.24, s*0.6, s*0.4, 1,1,'S');
    doc.circle(cx+s*0.12, cy-s*0.08, s*0.06, 'S');
  }
  function iconCalc(cx,cy,s,white){ white?icWhite():ic();
    doc.roundedRect(cx-s*0.28, cy-s*0.36, s*0.56, s*0.72, 0.7,0.7,'S');
    doc.line(cx-s*0.2, cy-s*0.2, cx+s*0.2, cy-s*0.2);
    [-1,0,1].forEach(cx2=> [0,1,2].forEach(ry=>{
      doc.setFillColor((white?255:ROSE_DARK[0]),(white?255:ROSE_DARK[1]),(white?255:ROSE_DARK[2]));
      doc.circle(cx+cx2*s*0.16, cy+s*0.02+ry*s*0.14, 0.5, 'F');
    }));
  }
  function iconHeart(cx,cy,s,color){
    doc.setFillColor(color[0],color[1],color[2]);
    const r = s*0.24;
    doc.circle(cx-r*0.62, cy-r*0.28, r*0.72, 'F');
    doc.circle(cx+r*0.62, cy-r*0.28, r*0.72, 'F');
    doc.triangle(cx-r*1.28, cy-r*0.12, cx+r*1.28, cy-r*0.12, cx, cy+r*1.15, 'F');
  }
  // Ramita decorativa: se usa el recorte real de una ramita de la plantilla
  // (no una figura hecha con líneas y círculos), para que se vea igual que
  // las hojas del diseño original. Se coloca en el margen que quede libre a
  // los lados de las franjas, ahora que quedaron centradas. mirror=true usa
  // la versión reflejada (para que las hojas "abran" hacia el otro lado).
  function placeSprig(cx, topY, maxW, maxH, mirror){
    const ratio = 201/140; // alto/ancho real de la ramita recortada
    let w = maxW, h = w*ratio;
    if(h > maxH){ h = maxH; w = h/ratio; }
    doc.addImage(mirror ? PDF_TPL_SPRIG_MIRROR : PDF_TPL_SPRIG, 'JPEG', cx-w/2, topY, w, h);
  }
  // Ola moderna con degradado, hecha solo con vectores (óvalos en capas, de
  // rosa clarito a rosa fuerte) — no es una foto, así que se ajusta perfecto
  // a cualquier ancho de hoja sin deformarse, sin costuras y sin verse
  // cortada en el borde. Se dibuja siempre un poco más abajo del borde de la
  // hoja para que "sangre" y nunca se note dónde termina.
  function drawGradientWave(baseY, height, x0, waveW){
    const palette = [
      [253,235,242], [249,209,226], [244,178,206],
      [236,141,181], [222,101,153], [200,70,130]
    ];
    const n = palette.length;
    for(let i=0;i<n;i++){
      const t = i/(n-1);
      doc.setFillColor(palette[i][0],palette[i][1],palette[i][2]);
      const rx = waveW*(0.62 - t*0.07);
      const ry = height*(1.05 - t*0.28);
      const cx = x0 + waveW*(0.18 + t*0.58);
      const cy = baseY + height*0.55 + t*height*0.32;
      doc.ellipse(cx, cy, rx, ry, 'F');
    }
  }
  function iconInstagram(cx,cy,s){
    doc.setDrawColor(ROSE_TITLE[0],ROSE_TITLE[1],ROSE_TITLE[2]); doc.setLineWidth(0.5);
    doc.roundedRect(cx-s*0.32, cy-s*0.32, s*0.64, s*0.64, s*0.2, s*0.2, 'S');
    doc.circle(cx, cy, s*0.16, 'S');
    doc.setFillColor(ROSE_TITLE[0],ROSE_TITLE[1],ROSE_TITLE[2]);
    doc.circle(cx+s*0.2, cy-s*0.2, 0.5, 'F');
  }
  function iconFacebook(cx,cy,s){
    doc.setFillColor(ROSE_TITLE[0],ROSE_TITLE[1],ROSE_TITLE[2]);
    doc.circle(cx, cy, s*0.34, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
    doc.setTextColor(255,255,255);
    doc.text('f', cx, cy+1.4, {align:'center'});
    doc.setTextColor(INK[0],INK[1],INK[2]);
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); // el texto que sigue (el link) depende de que esto quede restaurado
  }
  const COLOR_SWATCH = {
    azul:[110,150,205], rojo:[196,68,68], negro:[45,42,48], blanco:[240,240,240],
    rosa:[228,140,178], beige:[221,199,168], cafe:[123,83,57], marron:[123,83,57],
    dorado:[196,160,90], plateado:[188,188,194], verde:[102,150,112], amarillo:[224,193,80],
    morado:[150,110,180], purpura:[150,110,180], gris:[160,160,166], nude:[224,196,176],
    vino:[130,45,70], coral:[230,132,112], fucsia:[210,62,132], turquesa:[95,178,178]
  };
  function swatchColor(name){
    const key = String(name||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
    for(const k in COLOR_SWATCH){ if(key.includes(k)) return COLOR_SWATCH[k]; }
    return [200,175,185];
  }

  /* ---------- datos ---------- */
  const groups = groupOrderItemsForPDF(o.items);
  const allSizes = Array.from(new Set(groups.flatMap(g=>Object.keys(g.sizes)))).sort((a,b)=>{
    const na = parseFloat(a), nb = parseFloat(b);
    if(!isNaN(na) && !isNaN(nb)) return na - nb;
    return String(a).localeCompare(String(b));
  });

  const rows = groups.map(g=>{
    const pares = allSizes.reduce((s,sz)=> s + Number(g.sizes[sz]||0), 0);
    const bruto = pares * g.price;
    const conPromo = bruto - bruto*((g.promo||0)/100);
    return { g, pares, importe: conPromo };
  });
  const totalPares = rows.reduce((s,r)=> s + r.pares, 0);
  const hayPromo2x1 = rows.some(r=> r.g.promoTipo==='2x1' || r.g.promo===50);
  const hayReposicion = rows.some(r=> r.g.isReturn);

  /* ---------- anchos de columna ajustados al contenido ---------- */
  doc.setFont('helvetica','normal'); doc.setFontSize(8.4);
  const w = (s)=> doc.getTextWidth(String(s));
  const P2 = CELL_PAD * 2;

  const anchoTallas = Math.max(8.4, ...allSizes.map(s=> w(s) + P2));
  // Modelo y Color siempre a su ancho completo (nunca se recortan ni se
  // encogen), ya sin espacio reservado para íconos.
  let colModelo   = Math.max(34, ...rows.map(r=> w(modelName(r.g.modelId))), w('MODELO')) + P2 + ICON_W;
  let colColor    = Math.max(20, ...rows.map(r=> w(r.g.color||'—')), w('COLOR')) + P2 + 4.8;
  let colTalla    = anchoTallas;
  let colPares    = Math.max(14, w('TOTAL')+P2, w('PARES')+P2) + 2;
  let colPrecio   = Math.max(18, ...rows.map(r=> w(money(r.g.price))), w('PRECIO')+P2, w('UNITARIO')+P2) + 3;
  doc.setFont('helvetica','bold');
  let colPromo    = showPromos ? Math.max(17, ...rows.map(r=> w(promoTextForPDF(r.g))), w('PROMO')) + P2 : 0;
  doc.setFont('helvetica','normal');
  let colImporte  = Math.max(24, ...rows.map(r=> w(money(r.importe))), w('SUBTOTAL')) + P2 + 3;

  const anchoUtil = PAGE_W - M*2;
  let anchoTabla = colModelo + colColor + colTalla*allSizes.length + colPares + colPrecio + colPromo + colImporte;

  if(anchoTabla > anchoUtil){
    // Modelo y Color NUNCA se recortan ni se encogen: si la tabla no cabe,
    // primero se angostan las columnas de talla al mínimo razonable, y si
    // aun así no alcanza, la tabla queda un poco más ancha que el margen —
    // nunca se sacrifica que se vea el nombre completo del modelo o el color.
    if(allSizes.length>0){
      colTalla = Math.max(6, colTalla - (anchoTabla - anchoUtil)/allSizes.length);
      anchoTabla = colModelo + colColor + colTalla*allSizes.length + colPares + colPrecio + colPromo + colImporte;
    }
  } else if(anchoTabla < anchoUtil){
    const sobra = anchoUtil - anchoTabla;
    const extraModeloColor = sobra * 0.55;
    colModelo += extraModeloColor * 0.62;
    colColor  += extraModeloColor * 0.38;
    const extraNumericas = sobra - extraModeloColor;
    const numCols = 3 + (allSizes.length>0?1:0) + (showPromos?1:0);
    const porColumna = extraNumericas / numCols;
    colPares   += porColumna;
    colPrecio  += porColumna;
    colImporte += porColumna;
    if(showPromos) colPromo += porColumna;
    if(allSizes.length>0) colTalla += porColumna / allSizes.length;
    anchoTabla = anchoUtil;
  }

  const xModelo  = M;
  const xColor   = xModelo + colModelo;
  const xTallas  = xColor + colColor;
  const xPares   = xTallas + colTalla*allSizes.length;
  const xPrecio  = xPares + colPares;
  const xPromo   = xPrecio + colPrecio;
  const xImporte = xPromo + colPromo;
  const xFin     = xImporte + colImporte;

  const separadores = [xColor, xPares, xPrecio];
  allSizes.forEach((_,i)=> separadores.push(xTallas + colTalla*i));
  if(showPromos) separadores.push(xPromo);
  separadores.push(xImporte);

  /* ---------- fondo de página + decoración de esquinas ----------
     Ramitas hechas con óvalos pequeños (no son ilustraciones reales, son una
     estilización sencilla) para dar un toque decorativo en las esquinas sin
     depender de imágenes externas. */
  function paintBackground(){
    doc.setFillColor(CREAM[0],CREAM[1],CREAM[2]);
    doc.rect(0,0,PAGE_W,PAGE_H,'F');
  }
  // Conversión píxel→mm: las 4 franjas de plantilla vienen del mismo diseño
  // de referencia (1536px de ancho = 210mm a su tamaño original). En vez de
  // estirarlas solo de ancho (eso las deformaba, se veían "chicloseadas"),
  // se agrandan de forma PROPORCIONAL — mismo factor en ancho y alto — para
  // que llenen mejor la hoja horizontal sin perder sus proporciones, y se
  // centran dejando un margen parejo y discreto a los lados.
  const PX = 210/1536;              // mm por pixel a tamaño original (210mm)
  const anchoUtilBandas = PAGE_W - M*2;
  const SCALE = Math.min(1.28, (anchoUtilBandas*0.92)/210); // agrandado moderado, nunca deformado
  const PXS = PX*SCALE;             // mm por pixel ya agrandado (igual para X y Y: no deforma)
  const BAND_W = 210*SCALE;
  const BAND_X = M + (anchoUtilBandas - BAND_W)/2;
  const HEAD_H_MM  = 240*PXS;
  const INFO_H_MM  = 170*PXS;
  const CARDS_H_MM = 145*PXS;
  const FOOT_H_MM  = 124*PXS;

  /* ---------- encabezado + tarjeta de datos (solo primera página) ----------
     Se usa la imagen real de la plantilla (logo, título, redes, tarjeta e
     íconos) en vez de recrearla con figuras; encima solo se dibuja el texto
     que cambia por pedido (folio, cliente y fecha), en las coordenadas
     exactas donde estaba el texto de ejemplo en la imagen original. */
  function drawMainHeader(){
    paintBackground();
    doc.addImage(PDF_TPL_HEAD, 'JPEG', BAND_X, 0, BAND_W, HEAD_H_MM);
    doc.addImage(PDF_TPL_INFO, 'JPEG', BAND_X, HEAD_H_MM, BAND_W, INFO_H_MM);

    doc.setFont('helvetica','normal'); doc.setFontSize(10.5*SCALE);
    doc.setTextColor(INK[0],INK[1],INK[2]);
    const valueY = 355*PXS; // misma fila para los 3 valores, igual que en la plantilla
    doc.text(fitText(doc, String(o.folio), 590*PXS-225*PXS-4*SCALE), BAND_X+225*PXS, valueY);
    doc.text(fitText(doc, clientName(o.clientId), 1150*PXS-628*PXS-4*SCALE), BAND_X+628*PXS, valueY);
    doc.text(fitText(doc, fdate(o.date), 1483*PXS-1195*PXS-4*SCALE), BAND_X+1195*PXS, valueY);

    return HEAD_H_MM + INFO_H_MM + 2; // Y donde empieza la tabla (espacio angosto, para caber más renglones por hoja)
  }

  /* ---------- encabezado corto (páginas siguientes) ---------- */
  function drawContinuationHeader(){
    paintBackground();
    doc.setFillColor(ROSE_DARK[0],ROSE_DARK[1],ROSE_DARK[2]);
    doc.rect(0,0,PAGE_W,20,'F');
    doc.setTextColor(255,255,255);
    doc.setFont('times','bold'); doc.setFontSize(14);
    doc.text('Sandalias Wiss', M, 12.5);
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.text(`Comprobante de pedido · Folio ${o.folio} · ${clientName(o.clientId)} (continuación)`, PAGE_W-M, 12.5, {align:'right'});
    doc.setTextColor(INK[0],INK[1],INK[2]);
    return 30;
  }

  /* ---------- encabezado de la tabla ---------- */
  function drawTableHead(topY){
    // Modelo / Color / Tallas: fondo claro con texto rosa oscuro (como en el
    // diseño de referencia). Total pares / Precio unitario / Subtotal: fondo
    // rosa fuerte con texto blanco, igual que antes.
    doc.setFillColor(255,255,255);
    doc.rect(M, topY, xPares - M, HEAD_H, 'F');
    doc.setFillColor(ROSE_DARK[0],ROSE_DARK[1],ROSE_DARK[2]);
    doc.rect(xPares, topY, xFin - xPares, HEAD_H, 'F');

    doc.setFont('helvetica','bold'); doc.setFontSize(9);
    doc.setTextColor(ROSE_DARK[0],ROSE_DARK[1],ROSE_DARK[2]);
    const labelBase = topY + HEAD_H/2 + 1.3;
    doc.text('MODELO', xModelo + CELL_PAD + ICON_W, labelBase, {align:'left'});
    doc.text('COLOR', xColor + colColor/2, labelBase, {align:'center'});
    allSizes.forEach((sz,i)=> doc.text(String(sz), xTallas + colTalla*i + colTalla/2, labelBase, {align:'center'}));

    doc.setTextColor(255,255,255);
    doc.setFontSize(7.7);
    const lineaArriba = topY + HEAD_H/2 - 1.0;
    const lineaAbajo  = topY + HEAD_H/2 + 3.2;
    doc.text('TOTAL', xPares + colPares/2, lineaArriba, {align:'center'});
    doc.text('PARES', xPares + colPares/2, lineaAbajo, {align:'center'});
    doc.text('PRECIO', xPrecio + colPrecio/2, lineaArriba, {align:'center'});
    doc.text('UNITARIO', xPrecio + colPrecio/2, lineaAbajo, {align:'center'});
    doc.setFontSize(8.2);
    if(showPromos) doc.text('PROMO', xPromo + colPromo/2, labelBase, {align:'center'});
    doc.setFontSize(8.8);
    doc.text('SUBTOTAL', xImporte + colImporte/2, labelBase, {align:'center'});
    doc.setTextColor(INK[0],INK[1],INK[2]);
    return topY + HEAD_H;
  }

  /* ---------- cuadrícula ---------- */
  function drawGrid(topY, bottomY, rowYs){
    doc.setDrawColor(ROSE_DARK[0],ROSE_DARK[1],ROSE_DARK[2]);
    doc.setLineWidth(0.35);
    doc.rect(M, topY, anchoTabla, bottomY - topY);
    doc.setDrawColor(205,140,163);
    doc.setLineWidth(0.35);
    separadores.forEach(x=> doc.line(x, topY, x, bottomY));
    (rowYs||[]).forEach(yLinea=> doc.line(M, yLinea, M + anchoTabla, yLinea));
  }

  let tableTop = drawMainHeader();
  let y = drawTableHead(tableTop);
  let zebra = 0;
  let rowYs = [y]; // línea entre el encabezado y el primer renglón
  const BODY_BOTTOM = PAGE_H - 26;

  rows.forEach(({g, pares, importe})=>{
    if(y + ROW_H > BODY_BOTTOM){
      drawGrid(tableTop, y, rowYs);
      doc.addPage('a4','portrait');
      tableTop = drawContinuationHeader();
      y = drawTableHead(tableTop);
      zebra = 0;
      rowYs = [y];
    }
    doc.setFillColor(zebra % 2 === 1 ? 250 : 255, zebra % 2 === 1 ? 227 : 246, zebra % 2 === 1 ? 236 : 250);
    doc.rect(M, y, anchoTabla, ROW_H, 'F');
    if(!g.isReturn){
      doc.setFillColor(STRONG_PINK[0],STRONG_PINK[1],STRONG_PINK[2]);
      doc.rect(xPares, y, xFin - xPares, ROW_H, 'F');
    }
    if(g.isReturn){
      doc.setFillColor(230,244,238);
      doc.rect(M, y, anchoTabla, ROW_H, 'F');
    }
    const base = y + ROW_H/2 + 1.15;
    doc.setFont('helvetica','bold'); doc.setFontSize(8.8);
    doc.setTextColor(ROSE_TEXT[0],ROSE_TEXT[1],ROSE_TEXT[2]);
    doc.text(modelName(g.modelId), xModelo + CELL_PAD + ICON_W, base);
    doc.setFont('helvetica','normal');
    doc.setTextColor(INK[0],INK[1],INK[2]);
    doc.text(g.color || '—', xColor + CELL_PAD, base);
    allSizes.forEach((sz,i)=>{
      const q = g.sizes[sz];
      doc.setTextColor(q?INK[0]:190, q?INK[1]:165, q?INK[2]:178);
      doc.text(q ? String(q) : '·', xTallas + colTalla*i + colTalla/2, base, {align:'center'});
    });
    doc.setFontSize(9.6);
    doc.setTextColor(ROSE_TEXT[0],ROSE_TEXT[1],ROSE_TEXT[2]);
    doc.setFont('helvetica','bold');
    doc.text(String(pares), xPares + colPares/2, base, {align:'center'});
    doc.text(money(g.price), xPrecio + colPrecio/2, base, {align:'center'});
    doc.setFontSize(8.6);
    doc.setTextColor(INK[0],INK[1],INK[2]);
    if(showPromos){
      const txt = promoTextForPDF(g);
      if(txt !== '—'){ doc.setFont('helvetica','bold'); doc.setTextColor(ROSE_TITLE[0],ROSE_TITLE[1],ROSE_TITLE[2]); }
      doc.text(fitText(doc, txt, colPromo - P2), xPromo + colPromo/2, base, {align:'center'});
      doc.setFont('helvetica','normal'); doc.setTextColor(INK[0],INK[1],INK[2]);
    }
    doc.setFontSize(9.6);
    doc.setFont('helvetica','bold');
    doc.setTextColor(ROSE_TEXT[0],ROSE_TEXT[1],ROSE_TEXT[2]);
    doc.text(money(importe), xImporte + colImporte/2, base, {align:'center'});
    doc.setFontSize(8.6);
    doc.setFont('helvetica','normal');
    doc.setTextColor(INK[0],INK[1],INK[2]);
    y += ROW_H;
    zebra++;
    rowYs.push(y);
  });
  drawGrid(tableTop, y, rowYs);

  /* ---------- totales ---------- */
  // IMPORTANTE: el total que se muestra SIEMPRE debe ser el que el cliente
  // realmente debe pagar (con su descuento ya aplicado). "Mostrar
  // descuentos/promos" solo decide si se ve la etiqueta/columna de la
  // promoción — nunca debe cambiar el monto cobrado. Antes, si esa casilla
  // se dejaba sin marcar, el PDF mostraba el precio SIN descuento como si
  // fuera el total a pagar, lo cual era incorrecto.
  const totalMostrado = orderMerchSubtotal(o);
  const envioPedido = orderShippingCost(o);

  // Un solo desglose, calculado una sola vez (antes se calculaba por
  // separado según "showIVA" y según "o.ivaApplied", y si el pedido tenía
  // IVA las dos condiciones se cumplían a la vez → el IVA salía dos veces,
  // con dos subtotales distintos). El envío NUNCA lleva IVA, y ya no se
  // desglosa como línea aparte en el PDF (el cliente solo ve el total final,
  // que sí lo incluye).
  const lineasExtra = [];
  if(o.ivaApplied && showIVA){
    lineasExtra.push(['Subtotal (sin IVA):', money(totalMostrado)]);
    lineasExtra.push(['IVA (16%):', money(totalMostrado*0.16)]);
  }
  const totalFinal = (o.ivaApplied ? totalMostrado*1.16 : totalMostrado) + envioPedido;

  // Bloque completo: resumen de empaque + total. Se calcula su alto real
  // (incluye la leyenda de confirmación y la franja decorativa del pie) y, si
  // no cabe, se pasa a una hoja nueva en vez de encimarse con el pie de página.
  // Importante: se fija la MISMA fuente/tamaño que se usará para dibujar el
  // texto (bolditalic 8.8) antes de calcular en qué renglones se parte —
  // si se calcula con otra fuente activa, los saltos de línea no coinciden
  // con el ancho real y el texto se sale de la tarjeta.
  doc.setFont('helvetica','bolditalic'); doc.setFontSize(8.8);
  const legendLines = doc.splitTextToSize(ORDER_CONFIRM_LEGEND, anchoUtil - 20);
  const bloqueAlto = CARDS_H_MM + 6 + (lineasExtra.length * 5.5) + 7 + (legendLines.length * 4.6) + 8 + FOOT_H_MM + 3;
  if(y + bloqueAlto > PAGE_H){
    doc.addPage('a4','portrait');
    y = drawContinuationHeader();
  }

  let ty = y + 4;

  // Tarjeta "TOTAL DE PARES": recuadro nuevo, dibujado con el mismo estilo
  // (borde y tipografía) que ya usamos en el resto del comprobante, colocado
  // en el espacio libre a la izquierda de "TOTAL DEL PEDIDO".
  const cardsCropAspect = 901/145; // ancho/alto del recorte original
  const cardW = CARDS_H_MM * cardsCropAspect;
  const cardX = BAND_X + BAND_W - cardW; // recorrida a la derecha

  const paresBoxW = Math.min(cardX - BAND_X - 8, 62);
  if(paresBoxW > 28){
    doc.setDrawColor(CARD_LINE[0],CARD_LINE[1],CARD_LINE[2]); doc.setLineWidth(0.35);
    doc.setFillColor(255,255,255);
    doc.roundedRect(BAND_X, ty, paresBoxW, CARDS_H_MM, 2.4, 2.4, 'FD');
    doc.setFont('helvetica','bold'); doc.setFontSize(8.6);
    doc.setTextColor(ROSE_DARK[0],ROSE_DARK[1],ROSE_DARK[2]);
    doc.text('TOTAL DE', BAND_X+7, ty+CARDS_H_MM*0.36, {align:'left'});
    doc.text('PARES', BAND_X+7, ty+CARDS_H_MM*0.36+4.4, {align:'left'});
    doc.setFont('times','bold'); doc.setFontSize(21*SCALE);
    doc.setTextColor(ROSE_TEXT[0],ROSE_TEXT[1],ROSE_TEXT[2]);
    doc.text(String(totalPares), BAND_X+paresBoxW-7, ty+CARDS_H_MM/2+3, {align:'right'});
    doc.setTextColor(INK[0],INK[1],INK[2]);
  }

  doc.addImage(PDF_TPL_CARDS_TOTAL_ONLY, 'JPEG', cardX, ty, cardW, CARDS_H_MM);
  const cardPXS = cardW / 901; // mm por pixel dentro de este recorte
  const cardsValueY = ty + 40*PXS + 8*SCALE; // misma fila vertical que antes

  const totalValueText = money(totalFinal);
  let totalFontSize = 21*SCALE;
  doc.setFont('times','bold'); doc.setFontSize(totalFontSize);
  const totalValueMaxW = 835*cardPXS - 165*cardPXS; // no debe invadir el ícono/rótulo de la izquierda
  let totalValueW = doc.getTextWidth(totalValueText);
  while(totalValueW > totalValueMaxW && totalFontSize>13*SCALE){
    totalFontSize -= 1;
    doc.setFontSize(totalFontSize);
    totalValueW = doc.getTextWidth(totalValueText);
  }
  doc.text(totalValueText, cardX+835*cardPXS, cardsValueY, {align:'right'});
  doc.setFont('helvetica','normal');
  doc.setTextColor(INK[0],INK[1],INK[2]);

  ty += CARDS_H_MM + 3;

  // Desglose (IVA / envío) si aplica, y avisos de promoción/reposición.
  if(lineasExtra.length){
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.setTextColor(90,50,68);
    lineasExtra.forEach(([etq,val])=>{
      doc.text(etq, xFin-46, ty, {align:'right'});
      doc.text(val, xFin, ty, {align:'right'});
      ty += 5.5;
    });
    ty += 2;
  }
  const avisos = [];
  if(hayPromo2x1) avisos.push('Las filas marcadas 2x1 se envían completas; solo se cobra la mitad.');
  if(showPromos && Number(o.discount||0) > 0) avisos.push(`Descuento general aplicado: ${o.discount}%.`);
  if(avisos.length){
    doc.setFont('helvetica','italic'); doc.setFontSize(8);
    doc.setTextColor(150,110,128);
    doc.text(doc.splitTextToSize(avisos.join(' '), anchoUtil), M, ty);
    ty += doc.splitTextToSize(avisos.join(' '), anchoUtil).length * 4 + 3;
    doc.setFont('helvetica','normal');
  }

  /* ---------- observaciones ---------- */
  if(o.notes){
    doc.setFont('helvetica','normal'); doc.setFontSize(8.6); // misma fuente con la que se dibuja abajo
    const noteLines = doc.splitTextToSize(o.notes, anchoUtil - 4);
    doc.setFont('helvetica','bold'); doc.setFontSize(9);
    doc.setTextColor(ROSE_DARK[0],ROSE_DARK[1],ROSE_DARK[2]);
    doc.text('Observaciones:', M, ty+4);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.6);
    doc.setTextColor(INK[0],INK[1],INK[2]);
    doc.text(noteLines, M, ty+9);
    ty += 9 + noteLines.length*4.1;
  }

  /* ---------- leyenda de confirmación ---------- */
  const legendH = legendLines.length * 4.6 + 8;
  doc.setFillColor(SOFT_PINK[0],SOFT_PINK[1],SOFT_PINK[2]);
  doc.roundedRect(M, ty+1, anchoUtil, legendH, 3, 3, 'F');
  doc.setFont('helvetica','bolditalic'); doc.setFontSize(8.8);
  doc.setTextColor(ROSE_TEXT[0],ROSE_TEXT[1],ROSE_TEXT[2]);
  doc.text(legendLines, M+6, ty+1+6);

  /* ---------- pie moderno (solo última página) ----------
     Ya no es una foto: es una ola con degradado hecha con vectores (rosa
     clarito a rosa fuerte, inspirada en los ejemplos que mandaste) más el
     texto "¡Gracias por tu confianza!" dibujado directo, no recortado de
     ninguna imagen. Así se acaban de raíz los problemas que traía la foto
     (costuras, cortes en el borde, deformación): un degradado vectorial se
     ajusta perfecto a cualquier ancho, siempre.
  */
  const paginas = doc.getNumberOfPages();
  const footTop = PAGE_H - FOOT_H_MM*0.62;
  doc.setFont('helvetica','normal'); doc.setFontSize(7.4);
  doc.setTextColor(150,95,115);
  for(let p=1;p<=paginas;p++){
    doc.setPage(p);
    doc.text(`Página ${p} de ${paginas}`, M, footTop-6);
  }
  doc.setPage(paginas);

  const thanksY = footTop - 4;
  doc.setFont('times','italic'); doc.setFontSize(15*Math.min(SCALE,1.1));
  doc.setTextColor(ROSE_TITLE[0],ROSE_TITLE[1],ROSE_TITLE[2]);
  doc.text('¡Gracias por tu confianza!', PAGE_W/2, thanksY, {align:'center'});
  const thanksW = doc.getTextWidth('¡Gracias por tu confianza!');
  doc.setDrawColor(GOLD[0],GOLD[1],GOLD[2]); doc.setLineWidth(0.35);
  doc.line(PAGE_W/2 - thanksW/2 - 26, thanksY-1.4, PAGE_W/2 - thanksW/2 - 5, thanksY-1.4);
  doc.line(PAGE_W/2 + thanksW/2 + 5, thanksY-1.4, PAGE_W/2 + thanksW/2 + 26, thanksY-1.4);
  iconHeart(PAGE_W/2, thanksY+6, 3.4, ROSE_TITLE);

  doc.save(`Pedido_${o.folio}.pdf`);
  showToast('PDF generado.');
}

/* ================= PAGOS ================= */
views.pagos = function(){
  if(!can('verOperacion')){
    return `<h1 class="page-title">Pagos</h1><div class="page-sub">Tu usuario no tiene permiso para ver este módulo.</div>`;
  }
  let list = [...DB.payments].sort((a,b)=>b.date.localeCompare(a.date));
  const statusFilter = window._payStatusFilter || '';
  const clientFilter = window._payClientFilter || '';
  const orderFilter = window._payOrderFilter || '';
  if(clientFilter) list = list.filter(p=>{ const o=DB.orders.find(x=>x.id===p.orderId); return o && o.clientId===clientFilter; });
  if(orderFilter) list = list.filter(p=>p.orderId===orderFilter);
  const dateFrom = window._payDateFrom || '';
  const dateTo = window._payDateTo || '';
  if(dateFrom) list = list.filter(p=>p.date>=dateFrom);
  if(dateTo) list = list.filter(p=>p.date<=dateTo);

  // Mismo criterio de estado que el módulo Pedidos (orderStatus), para que un
  // pedido "Pendiente" ahí también se filtre igual aquí. "Vencido" es un caso
  // especial: no es un valor de orderStatus(), es un Pendiente/Parcial que ya
  // lleva más de 15 días sin liquidarse (ver orderIsOverdue).
  if(statusFilter === 'Vencido'){
    list = list.filter(p=>{
      const o = DB.orders.find(x=>x.id===p.orderId);
      return o && orderIsOverdue(o);
    });
  } else if(statusFilter){
    list = list.filter(p=>{
      const o = DB.orders.find(x=>x.id===p.orderId);
      return o && orderStatus(o)===statusFilter;
    });
  }

  const clientOptions = DB.clients.filter(c=>c.active!==false).sort((a,b)=>a.name.localeCompare(b.name,'es'));
  const orderOptions = [...DB.orders].sort((a,b)=>b.date.localeCompare(a.date));

  return `
    <h1 class="page-title">Pagos</h1>
    <div class="page-sub">Anticipos y liquidaciones registrados por pedido, con cuenta bancaria de destino.</div>
    ${renderOverdueAlertBox()}
    <div class="toolbar">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <select class="filter-input" style="flex:0 0 auto;width:150px;" onchange="window._payStatusFilter=this.value; render();">
          <option value="" ${!statusFilter?'selected':''}>Todos los estados</option>
          ${['Pendiente','Parcial','Vencido','Liquidado','Cancelado'].map(s=>`<option value="${s}" ${statusFilter===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <select class="filter-input" style="flex:0 0 auto;width:190px;" onchange="window._payClientFilter=this.value; render();">
          <option value="">Todos los clientes</option>
          ${clientOptions.map(c=>`<option value="${c.id}" ${clientFilter===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}
        </select>
        <label style="font-size:11.5px;color:var(--ink-soft);flex:0 0 auto;">Pedido
          <select class="filter-input" style="width:160px;" onchange="window._payOrderFilter=this.value; render();">
            <option value="">Todos los pedidos</option>
            ${orderOptions.map(o=>`<option value="${o.id}" ${orderFilter===o.id?'selected':''}>${o.folio}</option>`).join('')}
          </select>
        </label>
        <label style="font-size:11.5px;color:var(--ink-soft);flex:0 0 auto;">Desde <input type="date" class="filter-input" style="min-width:135px;" value="${dateFrom}" onchange="window._payDateFrom=this.value; render();"></label>
        <label style="font-size:11.5px;color:var(--ink-soft);flex:0 0 auto;">Hasta <input type="date" class="filter-input" style="min-width:135px;" value="${dateTo}" onchange="window._payDateTo=this.value; render();"></label>
        ${(statusFilter||clientFilter||orderFilter||dateFrom||dateTo)?`<button class="btn ghost sm" onclick="window._payStatusFilter='';window._payClientFilter='';window._payOrderFilter='';window._payDateFrom='';window._payDateTo=''; render();">Limpiar filtros</button>`:''}
      </div>
      <div style="display:flex;gap:10px;">
        <button class="btn ghost" onclick="exportPagosExcel()">Exportar a Excel</button>
        <button class="btn ghost" onclick="openBankAccountsAdmin()">Cuentas bancarias</button>
        <button class="btn brass" onclick="openPaymentForm()">+ Registrar pago</button>
      </div>
    </div>
    ${(() => {
      // Se agrupa por pedido para que el saldo total quede clarísimo arriba,
      // y debajo se vean los abonos (uno por exhibición) hasta liquidar —
      // en vez de una fila suelta por cada depósito sin contexto del total.
      const orderIdsInOrder = [];
      const byOrder = {};
      list.forEach(p=>{
        if(!byOrder[p.orderId]){ byOrder[p.orderId]=[]; orderIdsInOrder.push(p.orderId); }
        byOrder[p.orderId].push(p);
      });
      if(!orderIdsInOrder.length) return `<div style="background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);text-align:center;color:var(--ink-soft);padding:34px;font-style:italic;">No hay pagos registrados todavía.</div>`;
      return orderIdsInOrder.map(oid=>{
        const o = DB.orders.find(x=>x.id===oid);
        const pays = byOrder[oid].sort((a,b)=>a.date.localeCompare(b.date));
        const total = o ? orderTotal(o) : 0;
        const paid = o ? orderPaid(o) : 0;
        const saldo = Math.max(total-paid,0);
        return `
        <div style="background:var(--paper-raised);border:1px solid var(--line);border-radius:8px;margin-bottom:16px;overflow:hidden;">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:14px 18px;background:#f9e6ec;border-bottom:1px solid var(--line);">
            <div>
              <div style="font-family:'Fraunces',serif;font-weight:600;font-size:16px;">${o?o.folio:'—'} <span style="font-weight:400;font-size:13px;color:var(--ink-soft);">· ${o?clientName(o.clientId):'—'}</span></div>
              <div style="margin-top:4px;">${o?statusBadgeFull(o):''}</div>
            </div>
            <div style="display:flex;gap:28px;align-items:baseline;flex-wrap:wrap;">
              <div style="text-align:right;">
                <div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);">Total del pedido (con envío e IVA)</div>
                <div class="mono" style="font-size:14px;">${money(total)}</div>
              </div>
              <div style="text-align:right;">
                <div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);">Saldo total pendiente</div>
                <div class="mono" style="font-size:21px;font-weight:700;color:${saldo>0.009?'var(--red)':'var(--teal)'};">${money(saldo)}</div>
              </div>
            </div>
          </div>
          <div class="table-scroll">
          <table>
            <thead><tr><th>Fecha</th><th>Tipo</th><th>Abono</th><th>Monto cobrado</th><th>Envío (informativo)</th><th>Total abono</th><th>Paquetería</th><th>Cuenta</th><th>Referencia</th><th></th></tr></thead>
            <tbody>
            ${pays.map(p=>{
              const grandFinal = paymentGrandAmount(p);
              const g = paymentGroupInfo(p);
              return `<tr>
                <td>${fdate(p.date)}</td>
                <td>${escapeHtml(p.type)}</td>
                <td>${g.total>1 ? `<span class="badge parcial">Pago ${g.seq} de ${g.total}</span>` : `<span class="hint" style="display:inline;">Pago único</span>`}</td>
                <td class="mono">${money(p.amount)}</td>
                <td class="mono">${money(p.shippingCost||0)}</td>
                <td class="mono"><b>${money(grandFinal)}</b></td>
                <td>${escapeHtml(p.carrier||'—')}</td>
                <td>${escapeHtml(p.account||'—')}</td>
                <td>${escapeHtml(p.reference||'—')}</td>
                <td class="row-actions"><button class="btn ghost sm" onclick="openPaymentForm(null,'${p.id}')">Editar</button></td>
              </tr>`;
            }).join('')}
            </tbody>
          </table>
          </div>
        </div>`;
      }).join('');
    })()}
  `;
};

// La librería de Excel (SheetJS, edición gratuita) no soporta imágenes ni
// colores/estilos al escribir un .xlsx — solo columnas, filas, celdas
// combinadas y filtros. Para insertar el logo real de la empresa, se genera
// el Excel normalmente y después se edita el paquete .xlsx (que en realidad
// es un .zip) añadiendo la imagen y su referencia, con JSZip.
function dataUrlToUint8Array(dataUrl){
  const base64 = dataUrl.split(',')[1] || '';
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
function measureImage(dataUrl){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=> resolve({ w: img.naturalWidth || 240, h: img.naturalHeight || 240 });
    img.onerror = ()=> resolve({ w: 240, h: 240 });
    img.src = dataUrl;
  });
}
// Genera el .xlsx a partir de un workbook de SheetJS, le incrusta el logo de
// DB.settings.logo como imagen real (si existe) en la esquina superior
// izquierda de la primera hoja, convierte el rango de datos en una Tabla de
// Excel de verdad (con su propio filtro y franjas de color) pintada en el
// rosa de la marca, y dispara la descarga del archivo final.
// Asume un workbook de una sola hoja (por eso usa siempre sheet1.xml).
// opts.table = { ref:'A6:L8', headers:['Fecha','Pedido',...], name:'TablaPagos' }
async function downloadBrandedExcel(wb, filename, opts={}){
  if(!window.XLSX){ showToast('El generador de Excel no cargó. Intenta de nuevo.'); return; }
  if(!window.JSZip){
    XLSX.writeFile(wb, filename);
    return;
  }
  try{
    const arrayBuf = XLSX.write(wb, { bookType:'xlsx', type:'array' });
    const zip = await JSZip.loadAsync(arrayBuf);
    let drawingRid = null;

    if(DB.settings.logo){
      const { w, h } = await measureImage(DB.settings.logo);
      const targetW = 90, targetH = Math.round(targetW * (h / w || 1));
      const EMU = 9525;
      const extCx = targetW * EMU, extCy = targetH * EMU;

      zip.file('xl/media/image1.png', dataUrlToUint8Array(DB.settings.logo));
      zip.file('xl/drawings/drawing1.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">
  <xdr:oneCellAnchor>
    <xdr:from><xdr:col>0</xdr:col><xdr:colOff>60000</xdr:colOff><xdr:row>0</xdr:row><xdr:rowOff>40000</xdr:rowOff></xdr:from>
    <xdr:ext cx="${extCx}" cy="${extCy}"/>
    <xdr:pic>
      <xdr:nvPicPr><xdr:cNvPr id="2" name="Logo"/><xdr:cNvPicPr/></xdr:nvPicPr>
      <xdr:blipFill>
        <a:blip xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:embed="rId1"/>
        <a:stretch><a:fillRect/></a:stretch>
      </xdr:blipFill>
      <xdr:spPr>
        <a:xfrm><a:off x="0" y="0"/><a:ext cx="${extCx}" cy="${extCy}"/></a:xfrm>
        <a:prstGeom prst="rect"><a:avLst/></a:prstGeom>
      </xdr:spPr>
    </xdr:pic>
    <xdr:clientData/>
  </xdr:oneCellAnchor>
</xdr:wsDr>`);
      zip.file('xl/drawings/_rels/drawing1.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/image1.png"/>
</Relationships>`);
      drawingRid = 'drawing';
    }

    const sheetPath = 'xl/worksheets/sheet1.xml';
    let sheetXml = await zip.file(sheetPath).async('string');
    const relsPath = 'xl/worksheets/_rels/sheet1.xml.rels';
    const relExisting = zip.file(relsPath);
    let relsXml = relExisting ? await relExisting.async('string') : `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>`;
    function nextRid(){
      const ids = [...relsXml.matchAll(/Id="rId(\d+)"/g)].map(m=>Number(m[1]));
      return 'rId' + (Math.max(0,...ids) + 1);
    }
    function addRel(type, target){
      const rid = nextRid();
      relsXml = relsXml.replace('</Relationships>', `<Relationship Id="${rid}" Type="${type}" Target="${target}"/></Relationships>`);
      return rid;
    }

    let drawingRidReal = null;
    if(drawingRid) drawingRidReal = addRel('http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing', '../drawings/drawing1.xml');

    let tableRid = null;
    if(opts.table){
      const t = opts.table;
      const cols = t.headers.map((name,i)=>`<tableColumn id="${i+1}" name="${escapeXml(name)}"/>`).join('');
      zip.file('xl/tables/table1.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<table xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" id="1" name="${t.name||'Tabla1'}" displayName="${t.name||'Tabla1'}" ref="${t.ref}" totalsRowShown="0">
  <autoFilter ref="${t.ref}"/>
  <tableColumns count="${t.headers.length}">${cols}</tableColumns>
  <tableStyleInfo name="TableStyleMedium2" showFirstColumn="0" showLastColumn="0" showRowStripes="1" showColumnStripes="0"/>
</table>`);
      tableRid = addRel('http://schemas.openxmlformats.org/officeDocument/2006/relationships/table', '../tables/table1.xml');
    }
    zip.file(relsPath, relsXml);

    if(!sheetXml.includes('xmlns:r=')){
      sheetXml = sheetXml.replace('<worksheet ', '<worksheet xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ');
    }
    // Quita el autofiltro simple si ya viene uno de SheetJS: la Tabla trae el suyo propio.
    if(opts.table) sheetXml = sheetXml.replace(/<autoFilter[^/]*\/>/, '');
    let tail = '';
    if(drawingRidReal) tail += `<drawing r:id="${drawingRidReal}"/>`;
    if(tableRid) tail += `<tableParts count="1"><tablePart r:id="${tableRid}"/></tableParts>`;
    if(tail) sheetXml = sheetXml.replace('</worksheet>', `${tail}</worksheet>`);
    zip.file(sheetPath, sheetXml);

    // Pinta los estilos de tabla predefinidos de Excel (que solo usan colores
    // de "tema") con el rosa de Sandalias Wiss, cambiando el color de acento
    // del tema. Esto hace que Excel pinte la Tabla en rosa.
    if(opts.table){
      const themePath = 'xl/theme/theme1.xml';
      const themeFile = zip.file(themePath);
      if(themeFile){
        let theme = await themeFile.async('string');
        theme = theme.replace(/<a:accent1><a:srgbClr val="[0-9A-Fa-f]{6}"\/><\/a:accent1>/, '<a:accent1><a:srgbClr val="93365C"/></a:accent1>');
        zip.file(themePath, theme);
      }

      // Además, se pinta el relleno de cada celda directamente (encabezado en
      // rosa fuerte, filas de datos alternas en rosa muy claro). Esto es un
      // refuerzo: así se ve rosa también en lectores que no interpretan el
      // "estilo de Tabla" con nombre de Excel (Google Sheets, LibreOffice, etc.),
      // no solo en Excel.
      const stylesPath = 'xl/styles.xml';
      let styles = await zip.file(stylesPath).async('string');

      const fontsMatch = styles.match(/<fonts count="(\d+)"([^>]*)>([\s\S]*?)<\/fonts>/);
      const fontCount = Number(fontsMatch[1]);
      const headerFontId = fontCount;
      styles = styles.replace(fontsMatch[0], `<fonts count="${fontCount+1}"${fontsMatch[2]}>${fontsMatch[3]}<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>`);

      const fillsMatch = styles.match(/<fills count="(\d+)">([\s\S]*?)<\/fills>/);
      const fillCount = Number(fillsMatch[1]);
      const headerFillId = fillCount, bandFillId = fillCount+1;
      styles = styles.replace(fillsMatch[0], `<fills count="${fillCount+2}">${fillsMatch[2]}<fill><patternFill patternType="solid"><fgColor rgb="FF93365C"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFFAE6ED"/><bgColor indexed="64"/></patternFill></fill></fills>`);

      const xfsMatch = styles.match(/<cellXfs count="(\d+)">([\s\S]*?)<\/cellXfs>/);
      const xfCount = Number(xfsMatch[1]);
      const headerXf = xfCount, bandXf = xfCount+1;
      styles = styles.replace(xfsMatch[0], `<cellXfs count="${xfCount+2}">${xfsMatch[2]}<xf numFmtId="0" fontId="${headerFontId}" fillId="${headerFillId}" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="0" fontId="0" fillId="${bandFillId}" borderId="0" xfId="0" applyFill="1"/></cellXfs>`);

      zip.file(stylesPath, styles);

      function applyCellStyle(xml, rowNum, styleIdx){
        const rowRe = new RegExp(`(<row r="${rowNum}"[^>]*>)([\\s\\S]*?)(</row>)`);
        return xml.replace(rowRe, (m, open, inner, close)=>{
          const newInner = inner.replace(/<c r="([A-Z]+\d+)"([^>]*?)(\/?)>/g, (cm, ref, attrs, slash)=>{
            if(/\bs="/.test(attrs)) return cm;
            return `<c r="${ref}" s="${styleIdx}"${attrs}${slash}>`;
          });
          return `${open}${newInner}${close}`;
        });
      }
      const headerRow1 = opts.table.headerRow1;
      const dataRowCount = opts.table.dataRowCount || 0;
      sheetXml = applyCellStyle(sheetXml, headerRow1, headerXf);
      for(let i=0;i<dataRowCount;i++){
        if(i % 2 === 1) sheetXml = applyCellStyle(sheetXml, headerRow1 + 1 + i, bandXf);
      }
      zip.file(sheetPath, sheetXml);
    }

    const ctPath = '[Content_Types].xml';
    let ct = await zip.file(ctPath).async('string');
    if(drawingRidReal && !ct.includes('Extension="png"')) ct = ct.replace('</Types>', `<Default Extension="png" ContentType="image/png"/></Types>`);
    if(drawingRidReal && !ct.includes('drawing1.xml')) ct = ct.replace('</Types>', `<Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/></Types>`);
    if(tableRid && !ct.includes('table1.xml')) ct = ct.replace('</Types>', `<Override PartName="/xl/tables/table1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.table+xml"/></Types>`);
    zip.file(ctPath, ct);

    const blob = await zip.generateAsync({ type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(err){
    console.error('No se pudo aplicar el logo/tabla al Excel, se descarga en formato simple:', err);
    XLSX.writeFile(wb, filename);
  }
}
function escapeXml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
}

async function exportPagosExcel(){
  if(!window.XLSX){ showToast('El generador de Excel no cargó. Intenta de nuevo.'); return; }
  const list = [...DB.payments].sort((a,b)=>a.date.localeCompare(b.date));
  const rows = list.map(p=>{
    const o = DB.orders.find(x=>x.id===p.orderId);
    const shippingCost = Number(p.shippingCost||0);
    const total = paymentGrandAmount(p);
    const g = paymentGroupInfo(p);
    return {
      'Fecha': p.date,
      'Pedido': o?o.folio:'',
      'Cliente': o?clientName(o.clientId):'',
      'Tipo': p.type,
      'Exhibición': g.total>1 ? `Pago ${g.seq} de ${g.total}` : 'Pago único',
      'Monto': Number(p.amount||0),
      'Envío (informativo)': shippingCost,
      'Total': total,
      'Paquetería': p.carrier||'',
      'Cuenta': p.account||'',
      'Referencia': p.reference||'',
      'Estado pedido': o?orderStatus(o):''
    };
  });

  const HEADERS = ['Fecha','Pedido','Cliente','Tipo','Exhibición','Monto','Envío','Total','Paquetería','Cuenta','Referencia','Estado pedido'];
  const HEADER_ROW = 6; // deja filas libres arriba para el nombre de la empresa; el logo se ancla encima, sin invadir estas celdas
  const ws = XLSX.utils.json_to_sheet(rows, { header: HEADERS, origin: `A${HEADER_ROW}` });

  XLSX.utils.sheet_add_aoa(ws, [
    ['SANDALIAS WISS'],
    ['Reporte de pagos'],
    [`Generado el ${fdate(todayStr())}`],
  ], { origin: 'C1' });
  ws['!merges'] = (ws['!merges']||[]).concat([
    { s:{r:0,c:2}, e:{r:0,c:11} },
    { s:{r:1,c:2}, e:{r:1,c:11} },
    { s:{r:2,c:2}, e:{r:2,c:11} },
  ]);
  ws['!cols'] = [{wch:12},{wch:10},{wch:22},{wch:12},{wch:16},{wch:12},{wch:10},{wch:12},{wch:14},{wch:16},{wch:16},{wch:14}];

  const lastRow0 = (HEADER_ROW - 1) + Math.max(rows.length, 1);
  const tableRef = XLSX.utils.encode_range({ s:{r:HEADER_ROW-1, c:0}, e:{r:lastRow0, c:HEADERS.length-1} });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Pagos');
  await downloadBrandedExcel(wb, `Pagos_SandaliasWiss_${todayStr()}.xlsx`, {
    table: { ref: tableRef, headers: HEADERS, name: 'TablaPagos', headerRow1: HEADER_ROW, dataRowCount: rows.length }
  });
  showToast('Excel de pagos descargado.');
}

function openBankAccountsAdmin(){
  const accounts = DB.settings.bankAccounts || [];
  openModal(`
    <h2>Cuentas bancarias</h2>
    <div class="modal-sub">Aparecen como opción al registrar un pago. La referencia se llena automáticamente al elegir la cuenta.</div>
    <table style="margin-bottom:14px;">
      <thead><tr><th>Cuenta</th><th>Referencia</th><th></th></tr></thead>
      <tbody>
      ${accounts.length ? accounts.map((a)=>`<tr><td>${escapeHtml(a.name)}</td><td class="mono">${escapeHtml(a.reference||'—')}</td><td><button class="btn ghost sm" onclick="removeBankAccount('${a.id}')">Quitar</button></td></tr>`).join('') : `<tr class="empty-row"><td colspan="3">Sin cuentas registradas todavía.</td></tr>`}
      </tbody>
    </table>
    <div class="field-grid">
      <div class="field"><label>Nombre de la cuenta</label><input id="ba_name" placeholder="Ej. BBVA ****1234"></div>
      <div class="field"><label>Referencia</label><input id="ba_reference" placeholder="Ej. Sandalias Wiss / CLABE"></div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cerrar</button>
      <button class="btn brass" onclick="addBankAccount()">Agregar cuenta</button>
    </div>
  `);
}
async function addBankAccount(){
  const name = document.getElementById('ba_name').value.trim();
  if(!name){ showToast('Captura el nombre de la cuenta.'); return; }
  const reference = document.getElementById('ba_reference').value.trim();
  if(!sbClient){ showToast('No hay conexión con el servidor.'); return; }
  const { error } = await sbClient.from('bank_accounts').insert({ name, reference });
  if(error){
    showToast(error.code === '23505' ? 'Ya existe una cuenta con ese nombre.' : ('No se pudo agregar: ' + error.message));
    return;
  }
  await loadBankAccountsFromSupabase();
  openBankAccountsAdmin();
}
async function removeBankAccount(id){
  if(!guardCritical()) return;
  if(!sbClient){ showToast('No hay conexión con el servidor.'); return; }
  const { error } = await sbClient.from('bank_accounts').delete().eq('id', id);
  if(error){ showToast('No se pudo quitar la cuenta: ' + error.message); return; }
  await loadBankAccountsFromSupabase();
  openBankAccountsAdmin();
}
const COMMON_CARRIERS = ['Estafeta','DHL','FedEx','Paquetexpress','Correos de México','Redpack','UPS','Entrega en persona'];

/* Un mismo cobro puede llegar en varias exhibiciones (por ejemplo, dos depósitos
   en Oxxo de $5,000 y $3,000, o una parte a una cuenta y otra parte a otra).
   Cada depósito se guarda como su propio renglón, pero todos comparten un
   "groupId" para poder editarlos juntos y numerarlos Pago 1, Pago 2, … */
function paymentGroupInfo(p){
  if(!p) return { seq:1, total:1, members:[] };
  if(!p.groupId) return { seq:1, total:1, members:[p] };
  const members = DB.payments
    .filter(x=>x.groupId===p.groupId)
    .sort((a,b)=> (Number(a.seq)||0) - (Number(b.seq)||0));
  const idx = members.findIndex(x=>x.id===p.id);
  return { seq: Number(p.seq) || (idx+1), total: members.length, members };
}

function emptyDeposit(){
  return { id: uid('dep'), date: todayStr(), amount:'', account:'', reference:'' };
}

function openPaymentForm(orderId, editId){
  if(!guardPerm('registrarPagos', 'registrar o editar pagos')) return;
  const editing = editId ? DB.payments.find(x=>x.id===editId) : null;
  const grupo = editing ? paymentGroupInfo(editing).members : [];
  if(editing) orderId = editing.orderId;

  // Estado del formulario: encabezado común + lista de depósitos.
  window._payEditGroupIds = grupo.map(p=>p.id);
  // El IVA ya no se decide aquí: se define en el Pedido (Cotizador o al editar
  // el pedido). Este formulario solo refleja lo que ya trae el pedido, para
  // que nunca haya un pedido con IVA y un pago sin IVA (o viceversa).
  const linkedOrder = orderId ? DB.orders.find(x=>x.id===orderId) : null;
  // El envío se cobra UNA sola vez por pedido. Si ya quedó registrado en otro
  // pago (de otro grupo distinto al que se está editando ahora), se bloquea
  // aquí para que no se vuelva a sumar por duplicado.
  const otherShippingPay = orderId ? DB.payments.find(p=> p.orderId===orderId && !(grupo.map(g=>g.id)).includes(p.id) && (p.carrier || Number(p.shippingCost||0)>0)) : null;
  window._payShippingLocked = !!otherShippingPay;
  window._payHeader = editing ? {
    type: editing.type || 'Anticipo',
    shippingCost: otherShippingPay ? otherShippingPay.shippingCost : Number(grupo.find(p=>Number(p.shippingCost||0)>0)?.shippingCost || 0),
    carrier: otherShippingPay ? otherShippingPay.carrier : (editing.carrier || ''),
    ivaApplied: !!(linkedOrder ? linkedOrder.ivaApplied : editing.ivaApplied)
  } : {
    type:'Anticipo',
    shippingCost: otherShippingPay ? otherShippingPay.shippingCost : 0,
    carrier: otherShippingPay ? otherShippingPay.carrier : '',
    ivaApplied: !!(linkedOrder && linkedOrder.ivaApplied)
  };

  window._payDeposits = editing && grupo.length
    ? grupo.map(p=>({ id:p.id, date:p.date, amount:p.amount, account:p.account||'', reference:p.reference||'' }))
    : [emptyDeposit()];

  const orders = [...DB.orders].sort((a,b)=>b.date.localeCompare(a.date));
  const carrierList = Array.from(new Set([...COMMON_CARRIERS, ...(DB.settings.carrierOptions||[])]));
  const h = window._payHeader;

  openModal(`
    <h2>${editing?'Editar pago':'Registrar pago'}</h2>
    <div class="modal-sub">Si el cliente deposita en varias exhibiciones (por ejemplo dos depósitos en Oxxo, o una parte en una cuenta y otra parte en otra), agrega un renglón por cada depósito. Cada uno se guarda con su propia fecha, cuenta y referencia.</div>
    <div class="field-grid">
      <div class="field full"><label>Pedido</label>
        <select id="p_order" ${editing?'disabled':''} onchange="updatePaymentGrandTotal()">
          <option value="">Selecciona un pedido…</option>
          ${orders.map(o=>`<option value="${o.id}" ${orderId===o.id?'selected':''}>${o.folio} — ${clientName(o.clientId)} — saldo ${money(Math.max(orderTotal(o)-orderPaid(o),0))}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Tipo de cobro</label>
        <select id="p_type" onchange="updatePaymentGrandTotal()">
          ${['Anticipo','Abono','Liquidación'].map(t=>`<option ${h.type===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Costo de envío (una sola vez)</label>
        <input id="p_shipping" type="number" step="0.01" min="0" value="${h.shippingCost||0}" oninput="updatePaymentGrandTotal()" ${window._payShippingLocked?'disabled':''}>
        <div class="hint">Solo para registro/Embarques. Va incluido en el monto que captures arriba, no se suma aparte.</div>
        <div class="hint" id="p_shippingHint" style="margin-top:2px;display:${window._payShippingLocked?'block':'none'};">Ya se registró en otro pago de este pedido.</div>
      </div>
      <div class="field">
        <label>Paquetería</label>
        <select id="p_carrier" onchange="onCarrierSelect(this)">
          <option value="">Selecciona…</option>
          ${carrierList.map(c=>`<option value="${escapeAttr(c)}" ${h.carrier===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}
          <option value="__new__">+ Otra…</option>
        </select>
      </div>
      <div class="field"><label>IVA</label><label style="font-size:12.5px;text-transform:none;letter-spacing:0;color:var(--ink);"><input type="checkbox" id="p_iva" ${h.ivaApplied?'checked':''} disabled> ${h.ivaApplied?'Este pedido lleva IVA (16%)':'Este pedido no lleva IVA'}</label><div class="hint" id="p_ivaHint" style="margin-top:2px;">Se define en el pedido, no aquí. <a href="#" onclick="closeModal(); openOrderForm('${orderId||''}'); return false;">Editar pedido</a>.</div></div>
    </div>

    <label style="display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);margin:14px 0 6px 0;">Depósitos / exhibiciones</label>
    <div class="table-scroll">
      <table class="items-table" id="p_depositTable">
        <thead><tr><th style="width:92px;">Exhibición</th><th style="width:132px;">Fecha</th><th style="width:110px;">Monto</th><th>Cuenta bancaria</th><th>Referencia</th><th style="width:34px;"></th></tr></thead>
        <tbody id="p_depositBody"></tbody>
      </table>
    </div>
    <button class="btn ghost sm" type="button" onclick="addPaymentDeposit()" style="margin-top:8px;">+ Agregar otro depósito</button>
    <div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--line);">
      ${(DB.settings.bankAccounts||[]).length ? `<div class="hint">¿Falta una cuenta? <a href="#" onclick="closeModal(); openBankAccountsAdmin(); return false;">Agrégala aquí</a>.</div>` : `<div class="hint">Aún no hay cuentas registradas. <a href="#" onclick="closeModal(); openBankAccountsAdmin(); return false;">Agregar la primera</a>.</div>`}
    </div>

    <div style="background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 20px;margin:14px 0;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13px;padding:3px 0;"><span>Monto total a pagar (pedido + envío + IVA)</span><b id="p_totalPedido" class="mono">—</b></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:700;padding:5px 0;border-bottom:1px solid var(--line);margin-bottom:6px;padding-bottom:8px;"><span>Saldo</span><b id="p_saldoResultante" class="mono">—</b></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13px;padding:3px 0;"><span>Suma de depósitos (lo que se cobró en este pago)</span><b id="p_sumDepositos" class="mono">${money(0)}</b></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13px;padding:3px 0;color:var(--ink-soft);"><span>Envío conocido del pedido <span class="hint" style="display:inline;">(informativo — ya debe estar incluido en el monto de arriba, no se suma aparte)</span></span><b id="p_sumEnvio" class="mono">${money(0)}</b></div>
      <div style="text-align:center;margin-top:10px;">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);">Total de este pago</div>
        <div id="p_grandTotal" style="font-family:'Fraunces',serif;font-weight:700;font-size:32px;color:var(--pine);">${money(0)}</div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancelar</button>
      ${editing?`<button class="btn danger" onclick="deletePaymentGroup('${editId}')">Eliminar registro</button>`:''}
      <button class="btn brass" onclick="savePayment('${editId||''}')">Guardar pago</button>
    </div>
  `, true);

  setTimeout(()=>{
    if(editing){
      const c = document.getElementById('p_carrier'); if(c) c.value = h.carrier || '';
    }
    renderPaymentDeposits();
  }, 0);
}

function renderPaymentDeposits(){
  const body = document.getElementById('p_depositBody');
  if(!body) return;
  const accounts = DB.settings.bankAccounts || [];
  const tipo = document.getElementById('p_type')?.value || 'Anticipo';
  const varios = window._payDeposits.length > 1;
  body.innerHTML = window._payDeposits.map((d, i)=>`
    <tr>
      <td><b>${varios ? 'Pago '+(i+1) : tipo}</b>${varios?`<div class="hint" style="margin:0;">${escapeHtml(tipo)}</div>`:''}</td>
      <td><input type="date" id="dep_date_${i}" value="${escapeAttr(d.date||todayStr())}" oninput="setPaymentDeposit(${i},'date',this.value)"></td>
      <td><input type="number" step="0.01" min="0" id="dep_amount_${i}" value="${d.amount===''||d.amount==null?'':d.amount}" placeholder="0.00" oninput="setPaymentDeposit(${i},'amount',this.value)"></td>
      <td>
        <select id="dep_account_${i}" onchange="setPaymentDeposit(${i},'account',this.value); autoFillDepositReference(${i});">
          <option value="">Selecciona…</option>
          ${accounts.map(a=>`<option value="${escapeAttr(a.name)}" ${d.account===a.name?'selected':''}>${escapeHtml(a.name)}</option>`).join('')}
          ${d.account && !accounts.some(a=>a.name===d.account) ? `<option value="${escapeAttr(d.account)}" selected>${escapeHtml(d.account)}</option>` : ''}
        </select>
      </td>
      <td><input id="dep_reference_${i}" value="${escapeAttr(d.reference||'')}" placeholder="Folio, clave o nota" oninput="setPaymentDeposit(${i},'reference',this.value)"></td>
      <td style="text-align:center;">${window._payDeposits.length>1 ? `<button class="btn ghost sm" type="button" onclick="removePaymentDeposit(${i})">✕</button>` : ''}</td>
    </tr>`).join('');
  updatePaymentGrandTotal();
}
function addPaymentDeposit(){
  const last = window._payDeposits[window._payDeposits.length-1];
  const nuevo = emptyDeposit();
  if(last && last.date) nuevo.date = last.date;
  window._payDeposits.push(nuevo);
  renderPaymentDeposits();
}
function removePaymentDeposit(i){
  window._payDeposits.splice(i,1);
  if(!window._payDeposits.length) window._payDeposits.push(emptyDeposit());
  renderPaymentDeposits();
}
function setPaymentDeposit(i, field, value){
  if(!window._payDeposits[i]) return;
  window._payDeposits[i][field] = value;
  updatePaymentGrandTotal();
}
function autoFillDepositReference(i){
  const d = window._payDeposits[i];
  if(!d) return;
  const acc = (DB.settings.bankAccounts||[]).find(a=>a.name===d.account);
  if(acc && acc.reference && !d.reference){
    d.reference = acc.reference;
    const input = document.getElementById('dep_reference_'+i);
    if(input) input.value = acc.reference;
  }
}
function onCarrierSelect(selectEl){
  if(selectEl.value !== '__new__') return;
  const entered = prompt('Escribe la nueva paquetería:');
  if(!entered || !entered.trim()){ selectEl.value=''; return; }
  const val = entered.trim();
  commitOption('carrierOptions', val);
  const opt = document.createElement('option');
  opt.value = val; opt.textContent = val; opt.selected = true;
  selectEl.insertBefore(opt, selectEl.lastElementChild);
}
function onResponsibleSelect(selectEl){
  if(selectEl.value !== '__new__') return;
  const entered = prompt('Escribe el nombre del responsable:');
  if(!entered || !entered.trim()){ selectEl.value=''; return; }
  const val = entered.trim();
  const opt = document.createElement('option');
  opt.value = val; opt.textContent = val; opt.selected = true;
  selectEl.insertBefore(opt, selectEl.lastElementChild);
}
function fillPaymentReference(sel){
  // Se conserva por compatibilidad con formularios anteriores.
  const acc = (DB.settings.bankAccounts||[]).find(a=>a.name===sel.value);
  const refInput = document.getElementById('p_reference');
  if(acc && refInput) refInput.value = acc.reference || '';
}
function updatePaymentGrandTotal(){
  const deposits = window._payDeposits || [];
  const suma = deposits.reduce((s,d)=> s + (Number(d.amount)||0), 0);
  const shippingField = document.getElementById('p_shipping');
  const orderId = document.getElementById('p_order')?.value;
  const o = DB.orders.find(x=>x.id===orderId);

  // El envío se cobra una sola vez por pedido. Si ya quedó registrado en OTRO
  // pago de este mismo pedido (fuera del grupo que se está editando ahora),
  // se bloquea el campo para que no se vuelva a sumar por duplicado. Esto se
  // recalcula cada vez porque el pedido puede cambiar en este mismo formulario
  // (por ejemplo al elegirlo recién en el combo "Pedido").
  const otherShippingPay = o ? DB.payments.find(p=> p.orderId===o.id && !(window._payEditGroupIds||[]).includes(p.id) && (p.carrier || Number(p.shippingCost||0)>0)) : null;
  const shippingLocked = !!otherShippingPay;
  if(shippingField){
    if(shippingLocked && !shippingField.disabled) shippingField.value = otherShippingPay.shippingCost || 0;
    shippingField.disabled = shippingLocked;
  }
  const shippingHint = document.getElementById('p_shippingHint');
  if(shippingHint) shippingHint.style.display = shippingLocked ? 'block' : 'none';

  // Envío real del pedido (ya conocido o el que se está capturando ahora mismo).
  // Solo se usa para calcular el "Monto total a pagar" del pedido — el monto
  // de los depósitos es lo que YA se cobró (pueda incluir envío o no) y no se
  // le vuelve a sumar el envío encima, para no contarlo dos veces.
  const envioPedido = shippingLocked ? Number(otherShippingPay.shippingCost||0) : Number(shippingField?.value||0);

  // El IVA se sigue el pedido seleccionado, no un valor propio del formulario.
  const ivaCheck = document.getElementById('p_iva');
  const ivaHint = document.getElementById('p_ivaHint');
  const ivaOn = !!(o && o.ivaApplied);
  if(ivaCheck){
    ivaCheck.checked = ivaOn;
    const lbl = ivaCheck.parentElement;
    if(lbl) lbl.lastChild.textContent = ivaOn ? ' Este pedido lleva IVA (16%)' : ' Este pedido no lleva IVA';
  }
  if(ivaHint) ivaHint.querySelector('a')?.setAttribute('onclick', `closeModal(); openOrderForm('${orderId||''}'); return false;`);

  // El total de ESTE pago es la suma de los depósitos capturados, tal cual —
  // lo que se captura YA es el monto real cobrado (incluya IVA o no, eso lo
  // decide quien lo captura). El sistema ya no le vuelve a sumar el 16% por
  // dentro: eso duplicaba el impuesto y descuadraba el saldo. El envío
  // tampoco se suma aparte aquí: si el cliente ya lo cubrió dentro de esos
  // depósitos (que es lo normal), sumarlo de nuevo aquí lo duplicaría.
  let grand = suma;

  const setTxt = (id, val)=>{ const el = document.getElementById(id); if(el) el.textContent = val; };
  setTxt('p_sumDepositos', money(suma));
  setTxt('p_sumEnvio', money(envioPedido));
  setTxt('p_grandTotal', money(grand));

  if(o){
    const merchTotal = orderMerchSubtotal(o);
    // El envío nunca lleva IVA: se suma aparte, después de aplicar el 16% solo
    // a la mercancía.
    const totalProyectado = (ivaOn ? merchTotal * 1.16 : merchTotal) + envioPedido;
    const yaPagadoOtrosGrupos = DB.payments
      .filter(p=>p.orderId===o.id && !(window._payEditGroupIds||[]).includes(p.id))
      .reduce((s,p)=> s + paymentGrandAmount(p), 0);
    const saldo = totalProyectado - yaPagadoOtrosGrupos - grand;
    setTxt('p_totalPedido', money(totalProyectado));
    setTxt('p_saldoResultante', money(Math.max(saldo,0)) + (saldo < -0.009 ? ' (sobrepago de ' + money(-saldo) + ')' : ''));
  } else {
    setTxt('p_totalPedido', '—');
    setTxt('p_saldoResultante', '—');
  }
  // Renumera las etiquetas "Pago 1 / Pago 2" si cambió el tipo de cobro.
  const tipo = document.getElementById('p_type')?.value;
  if(tipo && deposits.length > 1){
    deposits.forEach((_,i)=>{
      const cel = document.querySelector(`#p_depositBody tr:nth-child(${i+1}) .hint`);
      if(cel) cel.textContent = tipo;
    });
  }
}

async function savePayment(editId){
  const orderId = document.getElementById('p_order').value;
  if(!orderId){ showToast('Selecciona el pedido al que aplica el pago.'); return; }

  const deposits = (window._payDeposits||[])
    .map(d=>({ ...d, amount: Number(d.amount)||0 }))
    .filter(d=> d.amount > 0);
  if(!deposits.length){ showToast('Captura al menos un depósito con monto mayor a cero.'); return; }

  const carrierRaw = document.getElementById('p_carrier').value;
  const carrier = carrierRaw==='__new__' ? '' : carrierRaw;
  const tipo = document.getElementById('p_type').value;
  const shippingField = document.getElementById('p_shipping');
  // Si el envío ya se registró en otro pago de este pedido, no se vuelve a
  // guardar aquí (evita sumarlo dos veces al total cobrado).
  const envio = shippingField.disabled ? 0 : (Number(shippingField.value)||0);
  const ivaApplied = document.getElementById('p_iva').checked;
  const o = DB.orders.find(x=>x.id===orderId);

  // Se reemplaza el grupo completo: así editar, agregar o quitar un depósito
  // siempre deja la información consistente.
  const previos = (window._payEditGroupIds||[]);

  // Comprobación de errores: si con este pago el total cobrado del pedido
  // quedaría por arriba de lo que realmente debe, se avisa con claridad antes
  // de guardar (puede ser una propina/anticipo intencional, así que no se
  // bloquea, solo se confirma).
  if(o){
    const totalPedido = orderTotal(o);
    const yaPagadoOtros = DB.payments.filter(p=>p.orderId===o.id && !previos.includes(p.id)).reduce((s,p)=>s+paymentGrandAmount(p),0);
    const nuevoMonto = deposits.reduce((s,d)=>s+d.amount,0);
    const sobrepago = (yaPagadoOtros + nuevoMonto) - totalPedido;
    if(sobrepago > 0.5){
      if(!confirm(`⚠ Con este pago, lo cobrado (${money(yaPagadoOtros+nuevoMonto)}) quedaría por arriba del total del pedido (${money(totalPedido)}), por ${money(sobrepago)}.\n\n¿Seguro que quieres guardarlo así?`)) return;
    }
  }
  if(previos.length) DB.payments = DB.payments.filter(p=> !previos.includes(p.id));

  if(!sbClient){ showToast('No hay conexión con el servidor.'); return; }

  const groupId = uid('grp');

  if(previos.length){
    const { error: delError } = await sbClient.from('payments').delete().in('id', previos);
    if(delError){ showToast('No se pudo actualizar el pago: ' + delError.message); return; }
  }

  const rows = deposits.map((d,i)=> paymentToSupabaseRow({
    groupId, seq: i+1, orderId,
    date: d.date || todayStr(), type: tipo, amount: d.amount,
    // El envío y el IVA se cargan una sola vez, en la primera exhibición.
    shippingCost: i===0 ? envio : 0,
    carrier: i===0 ? carrier : '',
    ivaApplied: i===0 ? ivaApplied : false,
    account: (d.account||'').trim(),
    reference: (d.reference||'').trim(),
  }));
  const { data: inserted, error: insError } = await sbClient.from('payments').insert(rows).select();
  if(insError){ showToast('No se pudo guardar el pago: ' + insError.message); return; }

  const nuevos = (inserted||[]).map(supabaseRowToPayment);
  DB.payments.push(...nuevos);
  await logAction(editId?'editar':'crear', 'pago', (o?o.folio:orderId) + ' · ' + nuevos.length + ' exhibición(es)', null, nuevos);

  window._payEditGroupIds = [];
  closeModal();
  showToast(nuevos.length>1
    ? `${nuevos.length} depósitos registrados (Pago 1 a Pago ${nuevos.length}).`
    : (editId ? 'Pago actualizado.' : 'Pago registrado.'));
  render();
}

async function deletePaymentGroup(payId){
  if(!guardCritical()) return;
  const p = DB.payments.find(x=>x.id===payId);
  if(!p) return;
  const ids = paymentGroupInfo(p).members.map(m=>m.id);
  if(!confirm(`Se eliminarán ${ids.length} depósito(s) de este registro. ¿Continuar?`)) return;
  if(!sbClient){ showToast('No hay conexión con el servidor.'); return; }
  const o = DB.orders.find(x=>x.id===p.orderId);
  const { error } = await sbClient.from('payments').delete().in('id', ids);
  if(error){ showToast('No se pudo eliminar el pago: ' + error.message); return; }
  DB.payments = DB.payments.filter(x=> !ids.includes(x.id));
  await logAction('eliminar', 'pago', o?o.folio:p.orderId, p, null);
  closeModal();
  showToast('Registro de pago eliminado.');
  render();
}

// Busca si ya se capturó paquetería y/o costo de envío al registrar el pago
// de este pedido. Se usa para que Embarques tome ese dato automáticamente en
// vez de permitir que alguien lo vuelva a escribir (y posiblemente distinto).
function paymentShippingInfo(orderId){
  if(!orderId) return null;
  const p = DB.payments.find(x=> x.orderId===orderId && (x.carrier || Number(x.shippingCost||0) > 0));
  if(!p) return null;
  return { carrier: p.carrier || '', shippingCost: Number(p.shippingCost || 0), paymentId: p.id };
}

views.embarques = function(){

  const carrierFilter = window._shipCarrier || '';
  const statusFilter = window._shipStatus || '';
  const responsibleFilter = window._shipResponsible || '';
  const clientFilter = window._shipClient || '';
  if(dateFrom) list = list.filter(s=>s.date>=dateFrom);
  if(dateTo) list = list.filter(s=>s.date<=dateTo);
  if(q) list = list.filter(s=>{ const o=DB.orders.find(x=>x.id===s.orderId); return (o&&o.folio.toLowerCase().includes(q)) || (o&&clientName(o.clientId).toLowerCase().includes(q)) || (s.trackingNumber||'').toLowerCase().includes(q); });

  if(responsibleFilter) list = list.filter(s=>s.responsible===responsibleFilter);
  if(clientFilter) list = list.filter(s=>{ const o=DB.orders.find(x=>x.id===s.orderId); return o && o.clientId===clientFilter; });

  // Las opciones de cada dropdown salen de la lista maestra (clientes activos,
  // paqueterías conocidas) y no solo de los embarques ya capturados — antes,
  // si todavía no había ningún embarque registrado, estos filtros salían
  // vacíos aunque el sistema sí tuviera clientes y paqueterías dadas de alta.
  const carriersUsed = Array.from(new Set([...COMMON_CARRIERS, ...(DB.settings.carrierOptions||[]), ...DB.shipments.map(s=>s.carrier).filter(Boolean)])).sort();
  const statusesUsed = ['En preparación','Enviado','En tránsito','Entregado'];
  const responsiblesUsed = Array.from(new Set([...(DB.settings.users||[]).map(u=>u.name), ...DB.shipments.map(s=>s.responsible)].filter(Boolean))).sort((a,b)=>a.localeCompare(b,'es'));
  const clientsWithShipments = DB.clients.filter(c=>c.active!==false).sort((a,b)=>a.name.localeCompare(b.name,'es'));

  const anyFilter = dateFrom||dateTo||q||carrierFilter||statusFilter||responsibleFilter||clientFilter;

  return `

    <div class="toolbar">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <input class="filter-input" style="flex:0 0 auto;width:190px;" placeholder="Buscar folio, cliente o guía…" value="${window._shipFilter||''}" oninput="window._shipFilter=this.value; render();">

          <option value="">Todos los clientes</option>
          ${clientsWithShipments.map(c=>`<option value="${c.id}" ${clientFilter===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}
        </select>
        <select class="filter-input" style="flex:0 0 auto;width:150px;" onchange="window._shipCarrier=this.value; render();">
          <option value="">Toda paquetería</option>
          ${carriersUsed.map(c=>`<option value="${escapeAttr(c)}" ${carrierFilter===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}
        </select>
        <select class="filter-input" style="flex:0 0 auto;width:150px;" onchange="window._shipStatus=this.value; render();">
          <option value="">Todo estado</option>
          ${statusesUsed.map(s=>`<option value="${s}" ${statusFilter===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <select class="filter-input" style="flex:0 0 auto;width:160px;" onchange="window._shipResponsible=this.value; render();">
          <option value="">Todo responsable</option>
