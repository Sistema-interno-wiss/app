<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SANDALIAS WISS · Sistema interno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#3d2432;
    --ink-soft:#8a6575;
    --paper:#fdf0f4;
    --paper-raised:#fffbfd;
    --line:#f3d9e2;
    --brass:#c96a90;
    --brass-dark:#a94d73;
    --pine:#93365c;
    --pine-light:#ac5178;
    --amber:#c2872f;
    --amber-bg:#fbeed9;
    --teal:#4a8a72;
    --teal-bg:#e2f0ea;
    --red:#a4402f;
    --red-bg:#f7e4df;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;line-height:1.5;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---- shell ---- */
  .shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh;}
  .sidebar{background:var(--pine);color:#eef0e8;padding:22px 16px;display:flex;flex-direction:column;gap:4px;}
  .brand{padding:0 8px 20px 8px;border-bottom:1px solid rgba(255,255,255,0.14);margin-bottom:16px;display:flex;align-items:center;gap:10px;}
  .brand-mark{width:38px;height:38px;flex:none;border-radius:50%;background:linear-gradient(145deg,var(--brass),var(--pine));display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:16px;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);}
  .brand .name{font-family:'Fraunces',serif;font-size:19px;font-weight:600;letter-spacing:0.5px;line-height:1.15;}
  .brand .tag{font-size:10.5px;text-transform:uppercase;letter-spacing:1.3px;color:#e7b9cc;margin-top:2px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius);cursor:pointer;color:#d7d9cd;font-size:13.5px;border-left:2px solid transparent;transition:all .15s;}
  .nav-item .nav-icon{flex:none;width:18px;height:18px;display:flex;align-items:center;justify-content:center;color:#a9836a;opacity:.85;transition:all .15s;}
  .nav-item .nav-icon svg{width:17px;height:17px;}
  .nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .nav-item:hover .nav-icon{color:var(--brass);opacity:1;transform:scale(1.06);}
  .nav-item.active{background:rgba(255,255,255,0.09);color:#fff;border-left:2px solid var(--brass);}
  .nav-item.active .nav-icon{color:var(--brass);opacity:1;}
  .sidebar-footer{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,0.14);font-size:11px;color:#8ea094;}

  .main{padding:26px 34px 60px 34px;max-width:1180px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px;}
  .search-global{flex:1;max-width:420px;position:relative;}
  .search-global input{width:100%;padding:9px 12px 9px 32px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-raised);font-family:'Inter';font-size:13px;color:var(--ink);}
  .search-global::before{content:'⌕';position:absolute;left:11px;top:8px;color:var(--ink-soft);font-size:14px;}
  .search-results{position:absolute;top:38px;left:0;right:0;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 6px 18px rgba(0,0,0,.08);max-height:320px;overflow:auto;z-index:50;display:none;}
  .search-results.show{display:block;}
  .search-results .sr-item{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px;}
  .search-results .sr-item:hover{background:var(--paper);}
  .search-results .sr-tag{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--brass-dark);margin-right:6px;}

  h1.page-title{font-size:26px;margin:0 0 4px 0;font-weight:600;}
  .page-sub{color:var(--ink-soft);font-size:13px;margin-bottom:22px;}

  /* ---- cards / grid ---- */
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
  .card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .card .k{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);margin-bottom:6px;}
  .card .v{font-family:'Fraunces',serif;font-size:26px;font-weight:600;}
  .card .v.small{font-size:19px;}
  .card.accent{border-left:3px solid var(--brass);}
  .card.warn .v{color:var(--amber);}
  .card.good .v{color:var(--teal);}

  /* ---- buttons ---- */
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--pine);color:#fff;border:none;padding:9px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;font-family:'Inter';}
  .btn:hover{background:var(--pine-light);}
  .btn.brass{background:var(--brass);}
  .btn.brass:hover{background:var(--brass-dark);}
  .btn.ghost{background:transparent;color:var(--pine);border:1px solid var(--line);}
  .btn.ghost:hover{background:var(--paper-raised);}
  .btn.sm{padding:5px 10px;font-size:12px;}
  .btn.danger{background:var(--red);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* ---- toolbar ---- */
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap;}
  .filter-input{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:13px;background:var(--paper-raised);min-width:220px;}
  .filter-input:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px rgba(201,106,144,.15);}
  .search-field{position:relative;display:inline-flex;align-items:center;}
  .search-field::before{content:'⌕';position:absolute;left:10px;color:var(--ink-soft);font-size:15px;pointer-events:none;}
  .search-field .clear-x{position:absolute;right:6px;border:none;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:13px;line-height:1;padding:4px 5px;border-radius:50%;}
  .search-field .clear-x:hover{background:var(--line);color:var(--ink);}

  /* ---- table ---- */
  table{width:100%;border-collapse:collapse;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.8px;color:var(--ink-soft);padding:10px 12px;border-bottom:1px solid var(--line);background:#f9e6ec;}
  tbody td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#faf8f2;}
  /* Se mantiene como celda de tabla (no flex) para que la columna de botones
     quede alineada con el resto del renglón. */
  .row-actions{white-space:nowrap;}
  .row-actions .btn{margin-right:6px;}
  .row-actions .btn:last-child{margin-right:0;}
  /* Igual que .row-actions pero permite que los botones bajen de línea: se usa
     para poner las acciones (Editar/Eliminar/etc.) pegadas al nombre en la
     primera columna de una tabla, para que nunca queden fuera de vista aunque
     la tabla tenga muchas columnas y requiera scroll horizontal. */
  .inline-actions{display:flex;flex-wrap:wrap;gap:6px;}
  .inline-actions .btn{margin:0;}
  /* Filas que se seleccionan con un clic (Clientes, Catálogo) para mostrar una
     sola barra de acciones arriba, en vez de repetir los botones en cada
     renglón. */
  tbody tr.selectable-row{cursor:pointer;}
  tbody tr.row-selected td{background:#f7e0ea;}
  .empty-row td{text-align:center;color:var(--ink-soft);padding:34px;font-style:italic;}

  /* Columna de acciones (Editar / Desactivar / Eliminar) fija a la derecha en
     tablas anchas con scroll horizontal (ej. Clientes con muchas columnas),
     para que los botones siempre queden a la vista sin tener que desplazar
     toda la tabla. Se excluye dentro de modales, donde las tablas ya son más
     angostas y no hace falta. */
  .table-scroll table thead th:last-child,
  .table-scroll table tbody td.row-actions{ position:sticky; right:0; z-index:2; }
  .table-scroll table thead th:last-child{ background:#f9e6ec; }
  .table-scroll table tbody td.row-actions{ background:var(--paper-raised); box-shadow:-6px 0 8px -6px rgba(0,0,0,.14); }
  .table-scroll table tbody tr:hover td.row-actions{ background:#faf8f2; }
  .modal .table-scroll table thead th:last-child,
  .modal .table-scroll table tbody td.row-actions{ position:static; box-shadow:none; }

  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px;}
  .badge.pendiente{background:var(--amber-bg);color:var(--amber);}
  .badge.parcial{background:#eee3c2;color:#8a6a1f;}
  .badge.liquidado{background:var(--teal-bg);color:var(--teal);}
  .badge.embarcado{background:#e0e6f2;color:#3d5382;}
  .badge.vencido{background:var(--red-bg);color:var(--red);font-weight:700;}
  .badge.activo{background:var(--teal-bg);color:var(--teal);}
  .badge.inactivo{background:#eee;color:#888;}

  /* ---- modal ---- */
  .overlay{position:fixed;inset:0;background:rgba(32,38,31,0.45);display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto;z-index:100;}
  .overlay.show{display:flex;}
  .modal{background:var(--paper-raised);border-radius:6px;width:100%;max-width:640px;padding:26px 28px 22px 28px;box-shadow:0 20px 50px rgba(0,0,0,.2);}
  .modal.wide{max-width:940px;}
  /* Las tablas dentro de un modal se ajustan al ancho disponible: no heredan el
     ancho mínimo de las tablas de pantalla completa. */
  .modal .table-scroll table{min-width:0;}
  .modal .items-table input, .modal .items-table select{width:100%;}
  .modal h2{margin:0 0 4px 0;font-size:20px;}
  .modal .modal-sub{color:var(--ink-soft);font-size:12.5px;margin-bottom:18px;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
  /* Caja de "chips" de colores: se auto-ajusta sola (flex-wrap), crece de
     alto conforme se agregan colores, sin scroll ni desbordarse. */
  .chips-box{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;padding:6px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-raised);}
  .color-chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--brass);border-radius:20px;padding:3px 6px 3px 10px;font-size:12.5px;}
  .color-chip span{cursor:pointer;}
  .color-chip button{border:none;background:var(--brass);color:#fff;width:16px;height:16px;border-radius:50%;font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .color-chip button:hover{background:var(--red);}
  .field{margin-bottom:12px;}
  .field.full{grid-column:1 / -1;}
  .field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);font-family:'Inter';font-size:13.5px;background:#fff;color:var(--ink);}
  .field textarea{resize:vertical;min-height:56px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
  .autocomplete-wrap{position:relative;}
  .ac-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-top:none;max-height:180px;overflow:auto;z-index:20;display:none;}
  .ac-list.show{display:block;}
  .ac-list div{padding:8px 10px;font-size:13px;cursor:pointer;}
  .ac-list div:hover{background:var(--paper);}
  .ac-list div.active{background:var(--brass);color:#fff;}

  /* ---- imágenes de producto ---- */
  .thumb{width:38px;height:38px;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:#fff;vertical-align:middle;}
  .thumb-placeholder{width:38px;height:38px;border-radius:4px;border:1px dashed var(--line);background:#faf3f5;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:14px;vertical-align:middle;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .table-scroll table{min-width:1080px;}
  .img-upload-box{display:flex;align-items:center;gap:14px;margin-bottom:4px;}
  .img-preview{width:84px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#fff;}
  .img-preview-placeholder{width:84px;height:84px;border-radius:6px;border:1px dashed var(--line);background:#faf3f5;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:11px;text-align:center;padding:4px;}

  /* ---- catálogo (galería) ---- */
  .catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;}
  .catalog-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s, transform .15s;position:relative;}
  .catalog-card:hover{box-shadow:0 8px 20px rgba(147,54,92,0.14);transform:translateY(-2px);}
  .catalog-card.inactive{opacity:.5;}
  .catalog-card .photo-wrap{position:relative;width:100%;aspect-ratio:1/1;background:#faf1f4;}
  .catalog-card .photo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .catalog-card .photo-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:36px;}
  .catalog-card .cbadge{position:absolute;top:8px;right:8px;}
  .catalog-card .info{padding:10px 12px 4px 12px;flex:1;}
  .catalog-card .cname{font-family:'Fraunces',serif;font-weight:600;font-size:14px;line-height:1.25;margin-bottom:4px;}
  .catalog-card .cprice{font-size:12.5px;color:var(--ink-soft);display:flex;justify-content:space-between;}
  .catalog-card .cprice b{color:var(--ink);font-family:'IBM Plex Mono',monospace;font-weight:500;}
  .catalog-card .cactions{display:flex;gap:6px;padding:8px 12px 12px 12px;}
  .catalog-card .cactions .btn{flex:1;justify-content:center;}
  .catalog-empty{grid-column:1/-1;text-align:center;color:var(--ink-soft);padding:40px;font-style:italic;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);}
  .view-toggle{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .view-toggle button{border:none;background:var(--paper-raised);color:var(--ink-soft);padding:8px 12px;font-size:12px;cursor:pointer;font-family:'Inter';}
  .view-toggle button.active{background:var(--pine);color:#fff;}

  /* ---- items table in pedido ---- */
  .items-table{margin:10px 0 14px 0;}
  .items-table th, .items-table td{font-size:12.5px;padding:7px 8px;}
  .items-table input, .items-table select{padding:5px 6px;font-size:12.5px;}
  .items-total{text-align:right;font-family:'Fraunces',serif;font-size:18px;margin-top:8px;}

  /* ---- cuadrícula de tallas del Cotizador ---- */
  .qc-grid-scroll{overflow-x:auto;border-radius:8px;border:1px solid var(--line);-webkit-overflow-scrolling:touch;}
  /* La cuadrícula se apretó para que quepa completa en una pantalla normal de
     laptop, sin tener que desplazarla de lado para ver el modelo o el subtotal. */
  .qc-grid{border-collapse:collapse;min-width:1040px;width:100%;}
  .qc-grid thead th{background:#2a1830;color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:9px 4px;text-align:center;white-space:nowrap;border:none;}
  .qc-grid thead th:first-child{text-align:left;padding-left:8px;}
  .qc-grid tbody td{padding:6px 3px;border-bottom:1px solid var(--line);background:var(--paper-raised);vertical-align:middle;}
  .qc-grid tbody td:first-child{padding-left:8px;}
  .qc-grid tbody tr:hover td{background:#fdf5f8;}
  .qc-model-input{width:138px;}
  .qc-color-input{width:165px;text-align:left;}
  .qc-color-select{width:165px; font-size:12px; padding:3px 4px;}
  .qc-size-input{width:38px;text-align:center;padding:4px 2px !important;}
  .qc-price-input{width:74px;text-align:right;}
  .qc-promo-select{min-width:98px;font-size:12px;}
  .qc-pares-cell{font-weight:600;text-align:center;min-width:104px;}
  .qc-pares-cell .qc-pares-num{display:inline-block;min-width:26px;padding:2px 7px;border-radius:12px;background:#efe0e7;color:var(--pine);font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .qc-chip{display:block;margin-top:3px;font-size:9.5px;font-weight:600;letter-spacing:.2px;line-height:1.25;text-transform:uppercase;}
  .qc-chip.promo{color:var(--amber);}
  .qc-chip.repo{color:var(--teal);}
  .qc-row-return td{background:#eef7f3 !important;}
  .qc-pack-note{margin:10px 0 4px 0;padding:10px 14px;border-radius:8px;background:var(--amber-bg);border:1px solid #e8cfa0;color:#7a5615;font-size:12.5px;line-height:1.5;}
  .qc-subtotal-cell{color:var(--brass-dark);font-weight:700;text-align:right;white-space:nowrap;}
  .qc-subtotal-cell.negative{color:var(--red);}
  .qc-grid-scrollbtns{display:flex;justify-content:center;gap:10px;margin:6px 0 4px 0;}
  .qc-grid-scrollbtns button{border:none;background:var(--line);color:var(--ink);width:30px;height:22px;border-radius:11px;cursor:pointer;}
  .qc-summary-card{max-width:360px;margin-left:auto;background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-top:20px;}
  .qc-summary-row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;padding:6px 0;}
  .qc-summary-row.total-pagar{font-size:19px;font-weight:700;padding-top:12px;border-top:1px solid var(--line);margin-top:6px;}
  .iva-toggle-btn{width:100%;border:1.5px dashed var(--brass);background:#fdf1f6;color:var(--brass-dark);border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer;text-align:left;margin:10px 0;}
  .iva-toggle-btn.active{background:var(--brass);color:#fff;border-style:solid;}
  .pdf-format-select{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--brass);background:#fdf1f6;color:var(--ink);font-size:13.5px;font-weight:700;cursor:pointer;margin-bottom:8px;}
  .whatsapp-btn{width:100%;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;margin-top:14px;background:linear-gradient(90deg,#c9236f,#e08a2b);display:flex;align-items:center;justify-content:center;gap:8px;}
  .whatsapp-btn:hover{filter:brightness(1.06);}
  .items-total .lbl{font-size:11px;font-family:'Inter';color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;}

  /* ---- reportes ---- */
  .report-section{margin-bottom:30px;}
  .report-section h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .report-section h3::before{content:'';width:14px;height:2px;background:var(--brass);display:inline-block;}
  .bar-row{display:grid;grid-template-columns:120px 1fr 90px;align-items:center;gap:10px;padding:6px 0;font-size:12.5px;}
  .bar-track{background:#f6dde6;border-radius:2px;height:9px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--brass);}
  .bar-fill.teal{background:var(--teal);}
  .split-bar{display:flex;height:22px;border-radius:3px;overflow:hidden;margin:10px 0;}
  .split-bar div:first-child{background:var(--teal);}
  .split-bar div:last-child{background:var(--amber);}
  .legend{display:flex;gap:18px;font-size:12px;color:var(--ink-soft);}
  .legend .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;}
  .dot.teal{background:var(--teal);}
  .dot.amber{background:var(--amber);}

  .toast{position:fixed;bottom:22px;right:22px;background:var(--pine);color:#fff;padding:12px 18px;border-radius:var(--radius);font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.2);z-index:200;opacity:0;transform:translateY(8px);transition:all .25s;}
  .toast.show{opacity:1;transform:translateY(0);}

  .hint{font-size:12px;color:var(--ink-soft);margin-top:-6px;margin-bottom:16px;}
  .loading{padding:60px;text-align:center;color:var(--ink-soft);}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}

  @media (max-width:900px){
    .shell{grid-template-columns:1fr;}
    .sidebar{flex-direction:row;overflow:auto;padding:12px;}
    .cards{grid-template-columns:repeat(2,1fr);}
    .field-grid{grid-template-columns:1fr;}
  }
</style>
</head>

// ================= CATÁLOGO (MODELOS) — conectado a Supabase =================
// Igual que Clientes: "models" ya no vive en el almacén local, vive en la
// tabla real "models" de Supabase. Los nombres de campo son casi idénticos;
// solo "priceHistory" (como se usa en el resto del código) se traduce a la
// columna real "price_history".
function modelToSupabaseRow(m){
  return {
    name: m.name, cost: Number(m.cost)||0, price: Number(m.price)||0,
    colors: m.colors||[], sizes: m.sizes||[], image: m.image||'',
    active: m.active !== false, price_history: m.priceHistory||[],
  };
}
function supabaseRowToModel(row){
  return {
    id: row.id, name: row.name, cost: Number(row.cost)||0, price: Number(row.price)||0,
    colors: row.colors||[], sizes: row.sizes||[], image: row.image||'',
    active: row.active !== false, priceHistory: row.price_history||[],
  };
}
async function loadModelsFromSupabase(){
  if(!sbClient) return;
  const { data, error } = await sbClient.from('models').select('*').order('name', { ascending: true });
  if(error){
    console.error('Error cargando el catálogo desde Supabase', error);
    showToast('No se pudo cargar el catálogo desde el servidor.');
    return;
  }
  DB.models = (data||[]).map(supabaseRowToModel);
}
async function seedModelsIfEmpty(){
  if(!sbClient || DB.models.length > 0 || !MODEL_CATALOG_SEED.length) return;
  const rows = MODEL_CATALOG_SEED.map(m => modelToSupabaseRow({ image:'', priceHistory:[], ...m }));
  const { data, error } = await sbClient.from('models').insert(rows).select();
  if(error){ console.error('Error poblando el catálogo inicial', error); return; }
  DB.models = (data||[]).map(supabaseRowToModel);
}

// ================= CLIENTES — conectado a Supabase =================
// A partir de aquí, "clients" YA NO vive en el almacén local (window.storage
// / localStorage) como el resto del sistema: vive en la tabla real "clients"
// de Supabase, compartida de verdad entre las 6 personas y protegida por las
// reglas de seguridad (RLS) que ya están activas ahí.
//
// La tabla en Supabase usa nombres de columna ligeramente distintos a los
// campos del formulario (cp en vez de zip, colonia en vez de colony) — estas
// dos funciones traducen en ambos sentidos para que el resto del código de
// la app (que ya usa "zip"/"colony" en cientos de lugares) no tenga que
// cambiar nada más.
function clientToSupabaseRow(c){
  return {
    name: c.name, contact: c.contact||'', phone: c.phone||'', email: c.email||'',
    rfc: c.rfc||'', cp: c.zip||'', address: c.address||'', colonia: c.colony||'',
    city: c.city||'', state: c.state||'', region: c.region||'', carrier: c.carrier||'',
    notes: c.notes||'', active: c.active !== false,
  };
}
function supabaseRowToClient(row){
  return {
    id: row.id, name: row.name, contact: row.contact||'', phone: row.phone||'',
    email: row.email||'', rfc: row.rfc||'', zip: row.cp||'', address: row.address||'',
    colony: row.colonia||'', city: row.city||'', state: row.state||'', region: row.region||'',
    carrier: row.carrier||'', notes: row.notes||'', active: row.active !== false,
  };
}
// Trae el directorio completo de clientes desde Supabase. Solo funciona con
// sesión iniciada (antes de eso, las reglas de seguridad devuelven 0 filas a
// propósito) — por eso se llama después del login, no en el arranque general.
async function loadClientsFromSupabase(){
  if(!sbClient) return;
  const { data, error } = await sbClient.from('clients').select('*').order('name', { ascending: true });
  if(error){
    console.error('Error cargando clientes desde Supabase', error);
    showToast('No se pudo cargar el directorio de clientes desde el servidor.');
    return;
  }
  DB.clients = (data||[]).map(supabaseRowToClient);
}
// ================= COLORES CAPTURADOS — compartidos vía Supabase =================
// Cuando alguien escribe un color nuevo con "+ Otro color…" (en el Cotizador
// o al editar un pedido), se guarda en la tabla real "color_options" de
// Supabase — así lo ve todo el equipo, no solo quien lo capturó.

  if(!sbClient) return;

  value = (value||'').trim().toUpperCase();
  if(!value) return;
  if(!DB.settings.colorOptions) DB.settings.colorOptions = [];
  const yaExiste = DB.settings.colorOptions.some(v=>v.toLowerCase()===value.toLowerCase());
  if(!yaExiste) DB.settings.colorOptions.push(value);
  if(!sbClient) return;

  // ya tiene un candado de "nombre único" — el segundo intento simplemente
  // no hace nada (no truena, no lo duplica).
  const { error } = await sbClient.from('color_options').insert({ name: value });
  if(error && error.code !== '23505'){ console.error('Error guardando el color nuevo', error); }
}

/* ---- Capa de almacenamiento con respaldo local ----------------------------
   Si el sistema corre dentro de un contenedor que provee window.storage, se usa
   ese (información compartida entre las dos personas). Si el archivo se abre
   directamente en el navegador, se usa el almacén del propio navegador para que
   los cambios (por ejemplo, marcar un cliente como inactivo) no se pierdan al
   recargar la página. Antes esto fallaba en silencio y por eso "no se guardaba".
--------------------------------------------------------------------------- */
const LOCAL_STORE_PREFIX = 'wiss_v20_';
const localStore = {
  async get(key){
    try{
      const raw = window.localStorage.getItem(LOCAL_STORE_PREFIX + key);
      return raw === null ? null : { value: raw };
    }catch(e){ return null; }
  },
  async set(key, value){
    try{ window.localStorage.setItem(LOCAL_STORE_PREFIX + key, value); return true; }
    catch(e){ return false; }
  }
};
function storageBackend(){
  return (window.storage && typeof window.storage.get === 'function') ? window.storage : localStore;
}
window.__storageOk = true;

async function loadAll(){
  // "clients" ya no se lee de aquí: vive en la tabla real de Supabase y se
  // carga aparte, en loadClientsFromSupabase() — solo después de iniciar
  // sesión, porque antes de eso las reglas de seguridad no dejan ver nada.
  const keys = ['logEntries','counters','settings'];
  const store = storageBackend();
  for(const k of keys){
    try{
      const res = await store.get(k, SHARED);
      if(res && res.value){ DB[k] = JSON.parse(res.value); }
    }catch(e){ /* key doesn't exist yet, keep default */ }
  }
  if(!DB.settings) DB.settings = { logo:'', bankAccounts: [], colorOptions: [], sizeOptions: [] };
  if(!DB.settings.bankAccounts) DB.settings.bankAccounts = [];
  if(!DB.settings.colorOptions) DB.settings.colorOptions = [];
  if(!DB.settings.sizeOptions) DB.settings.sizeOptions = [];
  if(!DB.settings.carrierOptions) DB.settings.carrierOptions = [];
  // Si todavía nadie ha guardado un logo (instalación nueva, o el almacén
  // compartido no tenía nada), se usa el logo oficial de Sandalias Wiss para
  // que el sistema no arranque sin marca. En cuanto alguien suba/edite el
  // logo desde Administración, ese será el que se use de aquí en adelante.
  if(!DB.settings.logo){
    DB.settings.logo = DEFAULT_LOGO;
    await save('settings');
  }
}
async function save(key){
  const payload = JSON.stringify(DB[key]);
  let ok = false;
  try{
    await storageBackend().set(key, payload, SHARED);
    ok = true;
  }catch(e){
    console.error('Error guardando en el almacén principal', key, e);
  }
  // Respaldo local siempre que sea posible: si el almacén compartido falla, la
  // información no se pierde al cerrar la página.
  try{ await localStore.set(key, payload); if(!ok) ok = true; }catch(e){}
  if(!ok && window.__storageOk){
    window.__storageOk = false;
    showToast('No se pudo guardar. Revisa tu conexión e intenta de nuevo.');
  }
  return ok;
}

// Antes, el número de folio se sacaba de un contador guardado en cada
// computadora (DB.counters.orderFolio) — eso funcionaba porque cada
// computadora tenía su propia lista de pedidos, separada. Ahora que los
// pedidos son compartidos de verdad entre las 6 personas, ese contador local
// ya no sirve: dos computadoras podrían generar el mismo folio al mismo
// tiempo. En su lugar, el folio se calcula a partir del máximo folio que
// existe ahora mismo en Supabase, y si por mala suerte dos personas
// capturan un pedido en el mismo instante, el sistema detecta el choque
// (folio repetido) y reintenta solo, sin que la persona note nada.
function computeNextFolio(){
  let max = 1000;
  DB.orders.forEach(o=>{
    const m = /^WS-(\d+)$/.exec(o.folio||'');
    if(m){ const n = Number(m[1]); if(n>max) max = n; }
  });
  return max + 1;
}
function orderToSupabaseRow(o){
  return {
    folio: o.folio, client_id: o.clientId || null, date: o.date,
    items: o.items||[], discount: Number(o.discount)||0,
    iva_applied: !!o.ivaApplied, notes: o.notes||'',
    cancelled: !!o.cancelled, versions: o.versions||[],
    import_ref: o.importRef || null,
    pdf_show_iva: (o.pdfShowIva===null || o.pdfShowIva===undefined) ? null : !!o.pdfShowIva,
    pdf_show_promos: !!o.pdfShowPromos,
  };
}
function supabaseRowToOrder(row){
  return {
    id: row.id, folio: row.folio, clientId: row.client_id||'', date: row.date,
    items: row.items||[], discount: Number(row.discount)||0,
    ivaApplied: !!row.iva_applied, notes: row.notes||'',
    cancelled: !!row.cancelled, versions: row.versions||[],
    importRef: row.import_ref||'',
    pdfShowIva: (row.pdf_show_iva===null || row.pdf_show_iva===undefined) ? null : !!row.pdf_show_iva,
    pdfShowPromos: !!row.pdf_show_promos,
  };
}
// Guarda las casillas "Desglosar IVA" / "Mostrar descuentos/promos" como
// preferencia de ESTE pedido en particular, para que la próxima vez que
// alguien lo abra (aunque sea desde otra computadora) ya estén marcadas
// igual — no se resetean cada vez que se abre el pedido.
async function savePdfPreference(orderId){
  const o = DB.orders.find(x=>x.id===orderId);
  if(!o) return;
  const showIva = document.getElementById('pdfIvaCheck_'+orderId).checked;
  const showPromos = document.getElementById('pdfPromoCheck_'+orderId).checked;
  const msg = `Vas a guardar esto para el pedido ${o.folio}:\n\n`
    + `• IVA en el PDF: ${showIva ? 'SÍ se va a desglosar en un renglón aparte' : 'NO se va a desglosar (se queda solo en el total)'}\n`
    + `• Descuentos/promos en el PDF: ${showPromos ? 'SÍ se van a mostrar en la tabla' : 'NO se van a mostrar en la tabla'}\n\n`
    + `Importante: esto solo cambia cómo se VE el PDF. El total a pagar siempre incluye el IVA y el descuento reales del pedido — eso se define en "Editar pedido", no aquí.\n\n`
    + `¿Confirmas guardar esta preferencia?`;
  if(!confirm(msg)) return;
  if(!sbClient){ showToast('No hay conexión con el servidor.'); return; }
  const { error } = await sbClient.from('orders').update({ pdf_show_iva: showIva, pdf_show_promos: showPromos }).eq('id', orderId);
  if(error){ showToast('No se pudo guardar la preferencia: ' + error.message); return; }
  o.pdfShowIva = showIva;
  o.pdfShowPromos = showPromos;
  showToast('Preferencia guardada para este pedido.');
}

// Crea un pedido nuevo en Supabase, generándole folio de forma segura.
// orderData trae: clientId, date, items, discount, ivaApplied, notes.
async function insertOrderToSupabase(orderData){
  if(!sbClient){ showToast('No hay conexión con el servidor.'); return null; }
  for(let intento=0; intento<5; intento++){
    const folio = 'WS-' + computeNextFolio();
    const row = orderToSupabaseRow({ ...orderData, folio, cancelled:false, versions: [] });
    const { data, error } = await sbClient.from('orders').insert(row).select().single();
    if(!error) return supabaseRowToOrder(data);
    if(error.code !== '23505'){
      console.error('Error creando pedido', error);
      showToast('No se pudo guardar el pedido: ' + error.message);
      return null;
    }
    // Folio duplicado: alguien más lo tomó justo antes — se recarga la lista
    // real y se calcula un folio nuevo, sin que la persona tenga que hacer
    // nada.
    await loadOrdersFromSupabase();
  }
  showToast('No se pudo generar un folio único después de varios intentos. Intenta de nuevo.');
  return null;
}
async function updateOrderInSupabase(id, patchLocal){
  if(!sbClient){ showToast('No hay conexión con el servidor.'); return false; }
  const row = orderToSupabaseRow(patchLocal);
  const { error } = await sbClient.from('orders').update(row).eq('id', id);
  if(error){
    console.error('Error actualizando pedido', error);
    showToast('No se pudo guardar el cambio: ' + error.message);
    return false;
  }
  return true;
}

async function logAction(action, entity, entityLabel, before, after){
  DB.logEntries.push({
    id: uid('log'),
    user: (window.currentUser && window.currentUser.name) || 'Sin sesión',
    at: new Date().toISOString(),
    action, entity, entityLabel,
    before: before ? JSON.stringify(before) : '',
    after: after ? JSON.stringify(after) : ''
  });
  if(DB.logEntries.length > 4000) DB.logEntries = DB.logEntries.slice(-4000);
  await save('logEntries');
}
// Traduce un renglón de bitácora a una frase legible de "qué cambió", campo
// por campo, para el módulo de Historial. Si el antes/después no se guardó
// completo (algunos módulos solo registran el "después"), se describe la
// acción en general en vez de inventar un detalle que no se capturó. La
// contraseña de usuarios nunca se muestra en claro, solo se avisa que cambió.
const LOG_ENTITY_LABELS = { pedido:'Pedido', cliente:'Cliente', producto:'Producto', pago:'Pago', embarque:'Embarque', usuario:'Usuario', permisos:'Roles y permisos' };
const LOG_FIELD_LABELS = { name:'nombre', email:'correo', phone:'teléfono', rfc:'RFC', zip:'C.P.', address:'dirección', colony:'colonia', city:'ciudad', state:'estado', region:'región', carrier:'paquetería', notes:'notas', contact:'contacto', cost:'costo', price:'precio', colors:'colores', sizes:'tallas', role:'rol', active:'estado activo', discount:'descuento', ivaApplied:'IVA' };
function logFieldFmt(v){
  if(v===undefined || v===null || v==='') return '—';
  if(Array.isArray(v)) return v.length ? v.join(', ') : '—';
  if(typeof v==='object') return '(detalle)';
  if(typeof v==='number') return String(v);
  return String(v);
}
function logDiffSummary(l){
  if(l.action==='crear') return 'Se creó el registro.';
  if(l.action==='eliminar') return 'Se eliminó de forma permanente.';
  if(l.action==='desactivar') return 'Se marcó como inactivo / cancelado.';
  if(l.action==='reactivar') return 'Se reactivó / marcó como activo.';
  let before=null, after=null;
  try{ before = l.before ? JSON.parse(l.before) : null; }catch(e){}
  try{ after = l.after ? JSON.parse(l.after) : null; }catch(e){}
  if(!before || !after || typeof before!=='object' || typeof after!=='object' || Array.isArray(before) || Array.isArray(after)){
    return 'Se editó el registro (detalle no disponible).';
  }
  const skip = new Set(['id','image']);
  const keys = Array.from(new Set([...Object.keys(before), ...Object.keys(after)]));
  const parts = [];
  keys.forEach(k=>{
    if(skip.has(k)) return;
    if(JSON.stringify(before[k]) === JSON.stringify(after[k])) return;
    if(k==='pass'){ parts.push('contraseña actualizada'); return; }
    const label = LOG_FIELD_LABELS[k] || k;
    parts.push(`${label}: ${logFieldFmt(before[k])} → ${logFieldFmt(after[k])}`);
  });
  return parts.length ? parts.join(' · ') : 'Se guardó sin cambios detectables en los datos.';
}

/* Al redibujar la pantalla se reemplaza todo el HTML, y el navegador quita el
   cursor del campo donde se estaba escribiendo. Por eso antes "se deseleccionaba
   el campo" al teclear la primera letra en los buscadores. Aquí se guarda cuál
   campo tenía el cursor y en qué posición, y se devuelve tal cual después de
   redibujar. */
function captureFocus(){
  const el = document.activeElement;
  if(!el || !el.id) return null;
  if(!['INPUT','TEXTAREA','SELECT'].includes(el.tagName)) return null;
  const snap = { id: el.id };
  try{
    if(typeof el.selectionStart === 'number'){
      snap.start = el.selectionStart;
      snap.end = el.selectionEnd;
    }
  }catch(e){ /* los input type=date/number no permiten leer la selección */ }
  return snap;
}
function restoreFocus(snap){
  if(!snap) return;
  const el = document.getElementById(snap.id);
  if(!el) return;
  el.focus();
  if(typeof snap.start === 'number'){
    try{ el.setSelectionRange(snap.start, snap.end); }catch(e){}
  }
}

function render(){
  const snap = captureFocus();
  const root = document.getElementById('viewRoot');
  root.innerHTML = views[currentView] ? views[currentView]() : '<p>Vista no encontrada.</p>';
  if(currentView === 'captura') renderQcGrid();
  restoreFocus(snap);
}

/* ================= HELPERS de negocio ================= */
function clientName(id){ const c = DB.clients.find(x=>x.id===id); return c ? c.name : '—'; }
function clientCode(id){
  const idx = DB.clients.findIndex(x=>x.id===id);
  return idx>=0 ? 'CLT-'+String(idx+1).padStart(4,'0') : '—';
}
function modelName(id){ const m = DB.models.find(x=>x.id===id); return m ? m.name : '—'; }

function itemSubtotal(it){
  const base = Number(it.qty||0) * Number(it.price||0);
  const disc = Number(it.itemDiscount||0);
  return Math.max(base - base*(disc/100), 0);
}
function orderMerchSubtotal(o){
  const sub = (o.items||[]).reduce((s,it)=> s + itemSubtotal(it), 0);
  const disc = sub * (Number(o.discount||0)/100);
  return Math.max(sub - disc, 0);
}
// Costo de envío del pedido: se toma del mismo dato que ya captura Pagos (y que
// alimenta Embarques), para que nunca haya dos versiones distintas del envío
// entre módulos. Si todavía no se registra ningún pago, es $0 (aún no se sabe).
function orderShippingCost(o){
  const info = paymentShippingInfo(o.id);
  return info ? info.shippingCost : 0;
}
// Total real que debe cubrir el cliente: mercancía (ya con su descuento,
// con IVA si el pedido lo lleva) + costo de envío. El envío NUNCA lleva IVA
// — se suma tal cual, aparte, después de calcular el IVA de la mercancía.
function orderTotal(o){
  const merch = orderMerchSubtotal(o);
  const merchConIVA = o.ivaApplied ? merch * 1.16 : merch;
  return merchConIVA + orderShippingCost(o);
}
// Lo que ya pagó el cliente en total: el monto de cada depósito ES lo que se
// cobró en esa exhibición (el monto real que se capturó, ya sea que incluya
// IVA o no — eso lo decide quien lo captura, no el sistema). El costo de
// envío guardado junto al depósito es solo informativo (para Embarques y
// para bloquear que se vuelva a capturar en otro pago): NO se vuelve a sumar
// aquí para no contar el envío dos veces, y el IVA del pedido NO se le vuelve
// a aplicar al monto capturado — eso duplicaba el impuesto y descuadraba el
// saldo.
function paymentGrandAmount(p){
  return Number(p.amount||0);
}
function orderPaid(o){
  return DB.payments.filter(p=>p.orderId===o.id).reduce((s,p)=>s+paymentGrandAmount(p),0);
}
function orderStatus(o){
  if(o.cancelled) return 'Cancelado';
  const total = orderTotal(o);
  const paid = orderPaid(o);
  if(paid <= 0) return 'Pendiente';
  if(paid < total) return 'Parcial';
  return 'Liquidado';
}
// Un pedido se considera "Vencido" cuando lleva más de 15 días sin liquidarse
// por completo (Pendiente o Parcial más allá de ese plazo). No es un estado
// aparte de los de siempre — es una alerta adicional sobre un pedido
// Pendiente/Parcial que ya se tardó, así que no afecta orderStatus() ni nada
// que ya dependa de sus 4 valores de siempre.
const OVERDUE_DAYS = 15;
function orderIsOverdue(o){
  if(o.cancelled) return false;
  const status = orderStatus(o);
  if(status !== 'Pendiente' && status !== 'Parcial') return false;
  const dias = (Date.now() - new Date(o.date+'T00:00:00').getTime()) / 86400000;
  return dias > OVERDUE_DAYS;
}
// Lista de pedidos vencidos (Pendientes o con solo un anticipo/Parcial, y ya
// pasados de los 15 días) para la ventana de alerta que se muestra en
// Pedidos, Pagos y Embarques.
function overdueOrdersList(){
  return DB.orders.filter(o=>orderIsOverdue(o)).map(o=>({
    o,
    dias: Math.floor((Date.now() - new Date(o.date+'T00:00:00').getTime())/86400000),
    saldo: Math.max(orderTotal(o)-orderPaid(o), 0),
    status: orderStatus(o)
  })).sort((a,b)=>b.dias-a.dias);
}
// Ventana de alerta / comprobación de errores: pedidos que llevan más de 15
// días sin liquidarse por completo (ya sea que no se haya cobrado nada
// todavía, o que se haya quedado solo con un anticipo). Se muestra arriba de
// Pedidos, Pagos y Embarques para que no se pasen por alto.
function renderOverdueAlertBox(){
  if(!can('verOperacion')) return '';
  const list = overdueOrdersList();
  if(!list.length) return '';
  return `
    <div style="background:#fbeae6;border:1px solid var(--red);border-radius:8px;padding:12px 16px;margin-bottom:16px;">
      <div style="color:var(--red);font-weight:700;font-size:13.5px;">⚠ ${list.length} pedido${list.length===1?'':'s'} con más de ${OVERDUE_DAYS} días sin liquidarse (pendiente o con solo un anticipo)</div>
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:4px;max-height:170px;overflow-y:auto;">
        ${list.map(({o,dias,saldo,status})=>`
          <div style="display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--line);cursor:pointer;" onclick="openOrderDetail('${o.id}')">
            <span><b>${o.folio}</b> · ${escapeHtml(clientName(o.clientId))} <span class="hint" style="display:inline;">(${status} · ${dias} días)</span></span>
            <span class="mono" style="color:var(--red);font-weight:700;">${money(saldo)}</span>
          </div>`).join('')}
      </div>
    </div>`;
}
function statusBadge(status){
  const cls = {'Pendiente':'pendiente','Parcial':'parcial','Liquidado':'liquidado','Embarcado':'embarcado','Cancelado':'inactivo'}[status] || 'pendiente';
  return `<span class="badge ${cls}">${status}</span>`;
}
// Igual que statusBadge(orderStatus(o)), pero agrega la alerta "Vencido" al
// lado cuando aplica, sin dejar de mostrar el estado real (Pendiente/Parcial).
function statusBadgeFull(o){
  return statusBadge(orderStatus(o)) + (orderIsOverdue(o) ? ` <span class="badge vencido" title="Más de ${OVERDUE_DAYS} días sin liquidarse">Vencido</span>` : '');
}
async function toggleCancelOrder(id){
  if(!guardCritical()) return;
  const o = DB.orders.find(x=>x.id===id);
  if(!o) return;
  const before = {...o};
  const nuevoCancelado = !o.cancelled;
  const ok = await updateOrderInSupabase(id, { ...o, cancelled: nuevoCancelado });
  if(ok) o.cancelled = nuevoCancelado;
  await logAction(o.cancelled?'cancelar':'reactivar', 'pedido', o.folio, before, o);
  showToast(o.cancelled ? 'Pedido marcado como cancelado.' : 'Pedido reactivado.');
  closeModal();
  render();
}

// Borrado permanente (a diferencia de "Cancelar", que solo marca el pedido
// como cancelado y conserva su historial). Se usa para corregir errores de
// captura o pedidos de prueba. Arrastra sus pagos y embarques para no dejar
// registros huérfanos apuntando a un pedido que ya no existe.
async function deleteOrder(id){
  if(!guardCritical()) return;
  const o = DB.orders.find(x=>x.id===id);
  if(!o) return;
  const pays = DB.payments.filter(p=>p.orderId===id);
  const ships = DB.shipments.filter(s=>s.orderId===id);
  let msg = `¿Eliminar el pedido ${o.folio} de forma permanente? Esta acción no se puede deshacer.`;
  if(pays.length || ships.length){
    msg += ` También se eliminarán ${pays.length} pago(s) y ${ships.length} embarque(s) registrados para este pedido.`;
  }
  if(!confirm(msg)) return;
  if(!sbClient){ showToast('No hay conexión con el servidor.'); return; }
  const before = { order: o, payments: pays, shipments: ships };
  const { error } = await sbClient.from('orders').delete().eq('id', id);
  if(error){
    console.error('Error eliminando pedido', error);
    showToast('No se pudo eliminar el pedido: ' + error.message);
    return;
  }
  DB.orders = DB.orders.filter(x=>x.id!==id);
  // Los pagos y embarques de este pedido se borran solos en el servidor (las
  // tablas están ligadas al pedido con "borrado en cascada"). Aquí solo se
  // refleja ese mismo cambio en lo que ya está cargado en pantalla.
  DB.payments = DB.payments.filter(p=>p.orderId!==id);
  DB.shipments = DB.shipments.filter(s=>s.orderId!==id);
  await logAction('eliminar', 'pedido', o.folio, before, null);
  showToast('Pedido eliminado.');
  closeModal();
  render();
}

async function toggleClientActive(id){
  const c = DB.clients.find(x=>x.id===id);
  if(!c) return;
  const before = {...c};
  const nuevoActivo = (c.active === false);   // false -> true (activar) · true/undefined -> false (desactivar)
  let ok = false;
  if(sbClient){
    const { error } = await sbClient.from('clients').update({ active: nuevoActivo }).eq('id', id);
    ok = !error;
    if(error) console.error('Error cambiando estado del cliente', error);
  }
  if(ok) c.active = nuevoActivo;
  await logAction(c.active?'reactivar':'desactivar', 'cliente', c.name, before, c);
  // Se cambia el filtro a "Todos" para que el cambio de estado quede a la vista
  // en la misma pantalla, en vez de que el renglón simplemente desaparezca.
  if(window._clientEstado !== 'todos') window._clientEstado = 'todos';
  showToast((c.active ? 'Cliente reactivado: ' : 'Cliente marcado como INACTIVO: ') + c.name + (ok ? '' : ' (no se pudo guardar)'));

// Borrado permanente del cliente (a diferencia de "Desactivar", que solo lo
// oculta del directorio activo pero conserva su historial). Los pedidos ya
// capturados con este cliente NO se borran ni se tocan: simplemente dejan de
// poder mostrar el nombre del cliente (aparecerá como "—"), igual que ya pasa
// hoy con clientName() cuando no encuentra el id.
async function deleteClient(id){
  if(!guardCritical()) return;
  const c = DB.clients.find(x=>x.id===id);
  if(!c) return;
  const numPedidos = DB.orders.filter(o=>o.clientId===id).length;
  let msg = `¿Eliminar al cliente "${c.name}" de forma permanente? Esta acción no se puede deshacer.`;
  if(numPedidos){
    msg += ` Tiene ${numPedidos} pedido(s) registrados; no se eliminarán, pero dejarán de mostrar el nombre del cliente. Si solo quieres ocultarlo sin perder esta referencia, usa "Desactivar" en vez de "Eliminar".`;
  }
  if(!confirm(msg)) return;
  if(!sbClient){ showToast('No hay conexión con el servidor.'); return; }
  const before = {...c};
  const { error } = await sbClient.from('clients').delete().eq('id', id);
  if(error){
    // Por diseño, el servidor no deja borrar clientes de forma permanente
    // (para no perder el historial de pedidos ligados a uno) — solo permite
    // "Desactivar". Si algún día se decide permitirlo, hay que agregar la
    // regla de seguridad correspondiente en Supabase.
    showToast('No se puede eliminar un cliente de forma permanente. Usa "Desactivar" en su lugar.');
    return;
  }
  DB.clients = DB.clients.filter(x=>x.id!==id);
  await logAction('eliminar', 'cliente', c.name, before, null);
  if(window._clientSelectedId === id) window._clientSelectedId = '';
  showToast('Cliente eliminado.');
  render();
}
async function saveClient(id){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ showToast('El nombre del cliente es obligatorio.'); return; }
  const data = {
    name,
    contact: document.getElementById('f_contact').value.trim(),
    phone: document.getElementById('f_phone').value.trim(),
    email: document.getElementById('f_email').value.trim(),
    rfc: document.getElementById('f_rfc').value.trim(),
    zip: document.getElementById('f_zip').value.trim(),
    address: document.getElementById('f_address').value.trim(),
    colony: document.getElementById('f_colony').value.trim(),
    city: document.getElementById('f_city').value.trim(),
    state: document.getElementById('f_state').value.trim(),
    region: document.getElementById('f_region').value.trim(),
    carrier: document.getElementById('f_carrier').value.trim(),
    notes: document.getElementById('f_notes').value.trim(),
  };
  if(!sbClient){ showToast('No hay conexión con el servidor. Revisa tu internet e intenta de nuevo.'); return; }
  if(id){
    const c = DB.clients.find(x=>x.id===id);
    const before = {...c};
    const active = document.getElementById('f_active').value === 'true';
    const row = clientToSupabaseRow({ ...data, active });
    const { data: updated, error } = await sbClient.from('clients').update(row).eq('id', id).select().single();
    if(error){ showToast('No se pudo guardar el cliente: ' + error.message); return; }
    Object.assign(c, supabaseRowToClient(updated));
    await logAction('editar', 'cliente', c.name, before, c);
  } else {
    const row = clientToSupabaseRow({ ...data, active: true });
    const { data: inserted, error } = await sbClient.from('clients').insert(row).select().single();
    if(error){ showToast('No se pudo crear el cliente: ' + error.message); return; }
    const c = supabaseRowToClient(inserted);
    DB.clients.push(c);
    await logAction('crear', 'cliente', c.name, null, c);
  }
  closeModal();
  showToast('Cliente guardado.');
  render();
}

async function toggleModelActive(id){
  if(!guardPerm('gestionarCatalogo', 'gestionar el catálogo')) return;
  const m = DB.models.find(x=>x.id===id);
  if(!m) return;
  const before = {...m};
  const nuevoActivo = (m.active === false);
  let ok = false;
  if(sbClient){
    const { error } = await sbClient.from('models').update({ active: nuevoActivo }).eq('id', id);
    ok = !error;
    if(error) console.error('Error cambiando estado del producto', error);
  }
  if(ok) m.active = nuevoActivo;
  await logAction(m.active?'reactivar':'desactivar', 'producto', m.name, before, m);
  if(window._modelEstado !== 'todos') window._modelEstado = 'todos';
  showToast((m.active ? 'Producto reactivado: ' : 'Producto marcado como INACTIVO: ') + m.name + (ok ? '' : ' (no se pudo guardar)'));
  render();
}
// Borrado permanente del producto (a diferencia de "Desactivar", que solo lo
// saca del catálogo disponible al capturar pero conserva su historial). Los
// pedidos ya capturados con este modelo NO se borran ni se tocan: solo dejan
// de poder mostrar su nombre (aparecerá como "—"), igual que ya pasa hoy con
// modelName() cuando no encuentra el id.
async function deleteModel(id){
  if(!guardCritical()) return;
  const m = DB.models.find(x=>x.id===id);
  if(!m) return;
  const enPedidos = DB.orders.some(o=>(o.items||[]).some(it=>it.modelId===id));
  let msg = `¿Eliminar el producto "${m.name}" de forma permanente? Esta acción no se puede deshacer.`;
  if(enPedidos){
    msg += ` Este modelo ya aparece en pedidos capturados; no se eliminarán, pero dejarán de mostrar el nombre del producto. Si solo quieres ocultarlo sin perder esta referencia, usa "Desactivar" en vez de "Eliminar".`;
  }
  if(!confirm(msg)) return;
  if(!sbClient){ showToast('No hay conexión con el servidor.'); return; }
  const before = {...m};
  const { error } = await sbClient.from('models').delete().eq('id', id);
  if(error){
    // Por diseño, el servidor no deja borrar productos de forma permanente
    // (para no perder la referencia en pedidos ya capturados) — solo permite
    // "Desactivar".
    showToast('No se puede eliminar un producto de forma permanente. Usa "Desactivar" en su lugar.');
    return;
  }
  DB.models = DB.models.filter(x=>x.id!==id);
  await logAction('eliminar', 'producto', m.name, before, null);
  if(window._modelSelectedId === id) window._modelSelectedId = '';
  showToast('Producto eliminado.');
  render();
}

    </div>

          <tbody>
          ${[...m.priceHistory].reverse().map(h=>`<tr><td>${new Date(h.at).toLocaleString('es-MX')}</td><td class="mono">${money(h.cost)}</td><td class="mono">${money(h.price)}</td><td>${escapeHtml(h.by||'—')}</td></tr>`).join('')}

    <div class="modal-actions">

// Editor de colores en "chips": cada color se puede editar (clic) o eliminar
// (×) por separado, en vez de tener que reescribir toda una lista separada
// por comas. El contenedor usa flex-wrap, así que se auto-ajusta solo — crece
// de alto conforme se agregan colores, sin desbordarse ni necesitar scroll.
function renderModelColorChips(){
  const box = document.getElementById('colorChipsBox');
  if(!box) return;
  const list = window._modelColorsDraft || [];
  box.innerHTML = list.length ? list.map((c,i)=>`
    <span class="color-chip">
      <span onclick="editModelColorChip(${i})" title="Clic para editar">${escapeHtml(c)}</span>
      <button type="button" onclick="removeModelColorChip(${i})" title="Eliminar color">×</button>
    </span>`).join('') : `<span class="hint">Sin colores capturados todavía — agrega el primero abajo.</span>`;
}
function toggleModelPriceHistory(){
  const box = document.getElementById('modelPriceHistoryBox');
  if(box) box.style.display = box.style.display==='none' ? 'block' : 'none';
}
function addModelColorChip(){
  const input = document.getElementById('f_mcolorNew');
  const val = (input.value||'').trim();
  if(!val) return;
  window._modelColorsDraft = window._modelColorsDraft || [];
  if(!window._modelColorsDraft.some(c=>c.toLowerCase()===val.toLowerCase())){
    window._modelColorsDraft.push(val);
  }
  input.value = '';
  renderModelColorChips();
  input.focus();
}
function removeModelColorChip(i){
  window._modelColorsDraft.splice(i,1);
  renderModelColorChips();
}
function editModelColorChip(i){
  const actual = window._modelColorsDraft[i];
  const val = prompt('Editar color:', actual);
  if(val===null) return;
  const trimmed = val.trim();
  if(!trimmed) return;
  window._modelColorsDraft[i] = trimmed;
  renderModelColorChips();
}
function handleModelImage(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('Selecciona un archivo de imagen.'); return; }
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxDim = 480;
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
      else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
      window._modelImageData = dataUrl;
      const wrap = document.getElementById('modelImgPreviewWrap');
      if(wrap) wrap.innerHTML = `<img class="img-preview" id="modelImgPreview" src="${dataUrl}">`;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function clearModelImage(){
  window._modelImageData = '';
  const wrap = document.getElementById('modelImgPreviewWrap');
  if(wrap) wrap.innerHTML = `<div class="img-preview-placeholder" id="modelImgPreview">Sin foto</div>`;
}
async function saveModel(id){
  const name = document.getElementById('f_mname').value.trim();
  if(!name){ showToast('El nombre del modelo es obligatorio.'); return; }
  const data = {
    name,
    cost: Number(document.getElementById('f_mcost').value)||0,
    price: Number(document.getElementById('f_mprice').value)||0,
    colors: [...(window._modelColorsDraft||[])],
    sizes: document.getElementById('f_msizes').value.split(',').map(s=>s.trim()).filter(Boolean),
    image: window._modelImageData || ''
  };
  if(!sbClient){ showToast('No hay conexión con el servidor. Revisa tu internet e intenta de nuevo.'); return; }
  if(id){
    const m = DB.models.find(x=>x.id===id);
    const before = {...m};
    const active = document.getElementById('f_mactive').value === 'true';
    let priceHistory = m.priceHistory || [];
    // Se guarda un registro del cambio solo si de verdad cambió el costo o
    // el precio (no cuando solo se editan colores o tallas).
    if(Number(m.cost)!==data.cost || Number(m.price)!==data.price){
      priceHistory = [...priceHistory, { at: new Date().toISOString(), cost: data.cost, price: data.price, by: (window.currentUser&&window.currentUser.name)||'—' }];
      if(priceHistory.length > 30) priceHistory = priceHistory.slice(-30);
    }
    const row = modelToSupabaseRow({ ...data, active, priceHistory });
    const { data: updated, error } = await sbClient.from('models').update(row).eq('id', id).select().single();
    if(error){ showToast('No se pudo guardar el modelo: ' + error.message); return; }
    Object.assign(m, supabaseRowToModel(updated));
    await logAction('editar', 'producto', m.name, before, m);
  } else {
    const row = modelToSupabaseRow({ ...data, active: true, priceHistory: [] });
    const { data: inserted, error } = await sbClient.from('models').insert(row).select().single();
    if(error){ showToast('No se pudo crear el modelo: ' + error.message); return; }
    const m = supabaseRowToModel(inserted);
    DB.models.push(m);
    await logAction('crear', 'producto', m.name, null, m);
  }
  closeModal();
  showToast('Modelo guardado.');
  render();
}

views.pedidos = function(){
  if(!can('verOperacion')){
    return `<h1 class="page-title">Pedidos</h1><div class="page-sub">Tu usuario no tiene permiso para ver este módulo.</div>`;
  }
  // Se agrupan en dos bloques, en vez de revueltos por fecha como antes:
  // arriba los Pendientes/Parciales (los que llevan MÁS tiempo esperando su
  // pago primero, para que no se olviden), y abajo los Liquidados y
  // Cancelados (los más recientes primero, ya no urgen).
  const grupoOrden = (o)=>{
    const s = orderStatus(o);
    if(s === 'Liquidado' || s === 'Cancelado') return 1;
    return 0;
  };
  let list = [...DB.orders].sort((a,b)=>{
    const ga = grupoOrden(a), gb = grupoOrden(b);
    if(ga !== gb) return ga - gb;
    return ga === 0 ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date);
  });
  if(window._filterOrdersClient){
    list = list.filter(o=>o.clientId===window._filterOrdersClient);
  }
  const q = (window._orderFilter||'').toLowerCase();
  if(q){
    list = list.filter(o => o.folio.toLowerCase().includes(q) || clientName(o.clientId).toLowerCase().includes(q));
  }
  const statusFilter = window._orderStatusFilter || '';
  if(statusFilter === 'Vencido') list = list.filter(o=>orderIsOverdue(o));
  else if(statusFilter) list = list.filter(o=>orderStatus(o)===statusFilter);
  const dateFrom = window._orderDateFrom || '';
  const dateTo = window._orderDateTo || '';
  if(dateFrom) list = list.filter(o=>o.date>=dateFrom);
  if(dateTo) list = list.filter(o=>o.date<=dateTo);

  const filterTag = window._filterOrdersClient ? `<div class="hint">Filtrando por cliente: <b>${clientName(window._filterOrdersClient)}</b> — <a href="#" onclick="window._filterOrdersClient=null; render(); return false;">quitar filtro</a></div>` : '';

  return `
    <h1 class="page-title">Pedidos</h1>
    <div class="page-sub">Consulta, edición y estado de cobro de cada pedido. La captura de pedidos nuevos se hace desde <b>Cotizador</b>.</div>
    ${renderOverdueAlertBox()}
    ${filterTag}
    <div class="toolbar">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <input class="filter-input" placeholder="Buscar por folio o cliente…" value="${window._orderFilter||''}" oninput="window._orderFilter=this.value; render();">
        <select class="filter-input" style="min-width:150px;" onchange="window._orderStatusFilter=this.value; render();">
          <option value="">Todos los estados</option>
          ${['Pendiente','Parcial','Vencido','Liquidado','Cancelado'].map(s=>`<option value="${s}" ${statusFilter===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <label style="font-size:11.5px;color:var(--ink-soft);">Desde <input type="date" class="filter-input" style="min-width:135px;" value="${dateFrom}" onchange="window._orderDateFrom=this.value; render();"></label>
        <label style="font-size:11.5px;color:var(--ink-soft);">Hasta <input type="date" class="filter-input" style="min-width:135px;" value="${dateTo}" onchange="window._orderDateTo=this.value; render();"></label>
        ${(dateFrom||dateTo)?`<button class="btn ghost sm" onclick="window._orderDateFrom='';window._orderDateTo=''; render();">Limpiar fechas</button>`:''}
      </div>
      <button class="btn ghost" onclick="openImportModal()">Importar desde Excel (Macro)</button>
      <button class="btn brass" onclick="goToView('captura')">+ Capturar en Cotizador</button>
    </div>
    <table>
      <thead><tr><th>Folio</th><th>Cliente</th><th>Fecha</th><th>Pares</th><th>Total</th><th>Saldo</th><th>Estado</th><th></th></tr></thead>
      <tbody>
      ${list.length ? list.map((o,i)=>{
        const total = orderTotal(o);
        const paid = orderPaid(o);
        const pieces = (o.items||[]).reduce((s,it)=>s+Number(it.qty||0),0);
        const divider = (i>0 && grupoOrden(list[i-1])===0 && grupoOrden(o)===1)
          ? `<tr class="empty-row"><td colspan="8" style="text-align:left;font-weight:700;color:var(--ink-soft);background:var(--paper);">— Liquidados / cancelados —</td></tr>` : '';
        return divider + `<tr>
          <td class="mono">${o.folio}${o.versions&&o.versions.length?` <span style="color:var(--ink-soft);font-size:11px;">v${o.versions.length+1}</span>`:''}</td>
          <td>${clientName(o.clientId)}</td>
          <td>${fdate(o.date)}</td>
          <td>${pieces}</td>
          <td class="mono">${money(total)}</td>
          <td class="mono">${money(Math.max(total-paid,0))}</td>
          <td>${statusBadgeFull(o)}</td>
          <td class="row-actions">
            <button class="btn ghost sm" onclick="openOrderDetail('${o.id}')">Ver</button>
            <button class="btn ghost sm" onclick="openOrderForm('${o.id}')">Editar</button>
            <button class="btn danger sm" onclick="deleteOrder('${o.id}')">Eliminar</button>
          </td>
        </tr>`;
      }).join('') : `<tr class="empty-row"><td colspan="8">No hay pedidos que coincidan. Los pedidos nuevos se capturan desde Cotizador.</td></tr>`}
      </tbody>
    </table>
  `;
};

function openOrderForm(existingId, duplicateFrom){
  if(existingId && !guardPerm('editarPedidos', 'editar pedidos ya capturados')) return;
  const editing = existingId ? DB.orders.find(o=>o.id===existingId) : null;
  const base = editing || (duplicateFrom ? DB.orders.find(o=>o.id===duplicateFrom) : null);
  const items = base ? JSON.parse(JSON.stringify(base.items||[])) : [];
  window._draftClientId = base ? base.clientId : '';
  // Igual que el Cotizador: tallas en columnas. Si el pedido trae alguna talla
  // fuera del catálogo estándar (por ejemplo capturada desde la Macro), se
  // agrega como columna extra para no perder esa información al editar.
  const extraSizes = Array.from(new Set((items||[]).map(it=>String(it.size||'')).filter(sz=>sz && !SHOE_SIZES.includes(sz))));
  window._draftGridSizes = [...SHOE_SIZES, ...extraSizes];
  window._draftGridRows = draftGridRowsFromItems(items, window._draftGridSizes);

  openModal(`

function acClients(val){
  window._draftClientId = '';
  updateDraftClientStatus();
  const box = document.getElementById('acClientList');
  if(!val){ box.classList.remove('show'); return; }
  const matches = DB.clients.filter(c=>c.active!==false && matchesQuery(val, c.name, c.city, c.state, c.phone)).slice(0,10);
  box.innerHTML = matches.map(c=>`<div onclick="pickClient('${c.id}','${escapeAttr(c.name)}')">${escapeHtml(c.name)}</div>`).join('') || `<div style="color:var(--ink-soft);cursor:default;">Sin coincidencias — se puede crear el cliente desde el módulo Clientes.</div>`;

function pickClient(id, name){
  window._draftClientId = id;
  document.getElementById('f_oclient').value = name;
  document.getElementById('acClientList').classList.remove('show');
  updateDraftClientStatus();
}
function updateDraftClientStatus(){
  const el = document.getElementById('draftClientStatus');
  if(!el) return;
  el.innerHTML = window._draftClientId
    ? `<span style="color:var(--teal);">✓ Cliente vinculado: <b>${escapeHtml(clientName(window._draftClientId))}</b> (${clientCode(window._draftClientId)})</span>`
    : `<span style="color:var(--red);">Aún no hay un cliente vinculado — elige una opción de la lista.</span>`;

/* ---- cuadrícula horizontal de partidas al editar/crear un pedido ----
   Mismo formato que el Cotizador: una fila por modelo+color, tallas como
   columnas. Los artículos planos del pedido (uno por talla) se agrupan al
   abrir el formulario y se vuelven a "aplanar" al guardar. */
function draftEmptyGridRow(sizes){
  const s = {};
  (sizes||window._draftGridSizes||SHOE_SIZES).forEach(sz=>s[sz]=0);
  return { id: uid('drow'), modelText:'', modelId:'', color:'', sizes:s, price:0, itemDiscount:0, meta:{}, returnFlag:false };
}
function draftGridRowsFromItems(items, sizes){
  const groups = {};
  const order = [];
  (items||[]).forEach(it=>{
    const key = (it.modelId||'')+'||'+(it.color||'');
    if(!groups[key]){
      const row = draftEmptyGridRow(sizes);
      const m = DB.models.find(x=>x.id===it.modelId);
      row.modelId = it.modelId||'';
      row.modelText = m ? m.name : '';
      row.color = it.color||'';
      row.price = Number(it.price||0);
      row.itemDiscount = Number(it.itemDiscount||0);
      groups[key] = row;
      order.push(key);
    }
    const row = groups[key];
    const sz = String(it.size||'');
    if(sz){
      row.sizes[sz] = (row.sizes[sz]||0) + Number(it.qty||0);
      const meta = {};
      if(it.promoTipo) meta.promoTipo = it.promoTipo;
      if(it.promoLabel) meta.promoLabel = it.promoLabel;
      if(it.isReturn) meta.isReturn = it.isReturn;
      row.meta[sz] = meta;
      if(it.isReturn) row.returnFlag = true;
    }
  });
  const rows = order.map(k=>groups[k]);
  return rows.length ? rows : [draftEmptyGridRow(sizes), draftEmptyGridRow(sizes)];
}
function draftRowTotals(row, sizes){
  const list = sizes||window._draftGridSizes||SHOE_SIZES;
  const pares = list.reduce((s,sz)=>s+Number(row.sizes[sz]||0),0);
  const base = pares * Number(row.price||0);
  const disc = Number(row.itemDiscount||0);
  const subtotal = Math.max(base - base*(disc/100), 0);
  return { pares, subtotal };
}
function addDraftGridRow(){
  window._draftGridRows.push(draftEmptyGridRow());
  renderDraftGrid();
}
function removeDraftGridRow(idx){
  window._draftGridRows.splice(idx,1);
  if(!window._draftGridRows.length) window._draftGridRows.push(draftEmptyGridRow());
  renderDraftGrid();
}
function draftGridModelInput(idx, val){
  window._draftGridRows[idx].modelText = val;
  window._draftGridRows[idx].modelId = '';
  const box = document.getElementById('draftModelSuggestBox');
  const input = document.getElementById('draftModelInput'+idx);
  if(!box || !input) return;
  if(!val || !val.trim()){ box.classList.remove('show'); return; }
  const matches = DB.models.filter(m=>m.active!==false && matchesQuery(val, m.name)).slice(0,10);
  box.innerHTML = matches.map(m=>`<div onclick="draftGridPickModel(${idx},'${m.id}','${escapeAttr(m.name)}',${m.price})">${escapeHtml(m.name)} <span style="color:var(--ink-soft);">· ${money(m.price)}</span></div>`).join('')
    || `<div style="color:var(--ink-soft);cursor:default;">Sin coincidencias — se creará como producto nuevo al guardar.</div>`;
  const rect = input.getBoundingClientRect();
  box.style.left = rect.left + 'px';
  box.style.top = (rect.bottom + 2) + 'px';
  box.style.width = Math.max(rect.width, 200) + 'px';
  box.classList.add('show');
}
function draftGridPickModel(idx, id, name, price){
  const row = window._draftGridRows[idx];
  // Si en verdad se está cambiando a OTRO modelo (no solo re-confirmando el
  // mismo), el precio se refresca al de lista del modelo nuevo. Antes solo se
  // llenaba el precio si el renglón estaba vacío, así que si ya tenía un precio
  // capturado (del modelo anterior) se quedaba pegado aunque se cambiara de
  // modelo X a modelo Y — quedando cobrado con el precio equivocado.
  const modelChanged = row.modelId !== id;
  row.modelId = id;
  row.modelText = name;
  if(modelChanged || !row.price) row.price = price;
  const input = document.getElementById('draftModelInput'+idx);
  if(input) input.value = name;
  const priceInput = document.getElementById('draftPriceInput'+idx);
  if(priceInput) priceInput.value = row.price;
  const box = document.getElementById('draftModelSuggestBox');
  if(box) box.classList.remove('show');
  updateDraftGridRowUI(idx);
}
async function draftGridColorSelect(selectEl, idx){
  if(selectEl.value === '__new__'){
    const entered = prompt('Escribe el nuevo color:');
    if(!entered || !entered.trim()){ selectEl.value = window._draftGridRows[idx].color || ''; return; }
    const val = entered.trim();
    await commitColorOption(val);
    window._draftGridRows[idx].color = val;
    renderDraftGrid();
    return;
  }
  window._draftGridRows[idx].color = selectEl.value;
}
function draftGridSetSize(idx, size, val){
  window._draftGridRows[idx].sizes[size] = Math.max(0, Number(val)||0);
  updateDraftGridRowUI(idx);
}
function draftGridSetPrice(idx, val){
  window._draftGridRows[idx].price = Number(val)||0;
  updateDraftGridRowUI(idx);
}
function draftGridSetDiscount(idx, val){
  window._draftGridRows[idx].itemDiscount = Math.max(0, Number(val)||0);
  updateDraftGridRowUI(idx);
}
// Igual que en el Cotizador: al marcar "Devolución/Reposición", el importe
// se va a $0 (se repone sin costo) pero se puede escribir a mano si sí se
// va a cobrar algo; al desmarcarla, regresa el precio que tenía antes.
function draftGridToggleReturn(idx, checked){
  const row = window._draftGridRows[idx];
  row.returnFlag = checked;
  if(checked){
    row.priceBeforeReturn = row.price;
    row.price = 0;
    row.itemDiscount = 0;
  } else if(row.priceBeforeReturn !== undefined){
    row.price = row.priceBeforeReturn;
    delete row.priceBeforeReturn;
  }
  renderDraftGrid();
}
function updateDraftGridRowUI(idx){
  const row = window._draftGridRows[idx];
  const t = draftRowTotals(row);
  const paresCell = document.getElementById('draftParesCell'+idx);
  const subCell = document.getElementById('draftSubCell'+idx);
  if(paresCell) paresCell.innerHTML = `<span class="qc-pares-num">${t.pares}</span>`;
  if(subCell) subCell.textContent = money(t.subtotal);
  updateDraftTotal();
}
function renderDraftGrid(){
  const body = document.getElementById('draftGridBody');
  if(!body) return;
  const sizes = window._draftGridSizes;
  body.innerHTML = window._draftGridRows.map((row, idx)=>{
    const t = draftRowTotals(row, sizes);
    return `<tr class="${row.returnFlag?'qc-row-return':''}">
      <td class="qc-model-cell">
        <input class="qc-model-input" id="draftModelInput${idx}" value="${escapeAttr(row.modelText)}" placeholder="Escribe para buscar…" autocomplete="off"
          oninput="draftGridModelInput(${idx}, this.value)"
          onfocus="draftGridModelInput(${idx}, this.value)">
      </td>
      <td><select class="qc-color-input" onchange="draftGridColorSelect(this, ${idx})">
        <option value="" ${!row.color?'selected':''}>—</option>
        ${COMMON_COLORS.map(c=>`<option value="${escapeAttr(c)}" ${row.color===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}
        ${(DB.settings.colorOptions||[]).filter(c=>!COMMON_COLORS.includes(c)).map(c=>`<option value="${escapeAttr(c)}" ${row.color===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}
        ${row.color && !COMMON_COLORS.includes(row.color) && !(DB.settings.colorOptions||[]).includes(row.color) ? `<option value="${escapeAttr(row.color)}" selected>${escapeHtml(row.color)}</option>` : ''}
        <option value="__new__">+ Otro color…</option>
      </select></td>
      ${sizes.map(sz=>`<td><input class="qc-size-input" id="draftSizeInput${idx}_${sz}" type="number" min="0" value="${row.sizes[sz]||0}" onfocus="this.select()" oninput="draftGridSetSize(${idx}, '${sz}', this.value)"></td>`).join('')}
      <td class="qc-pares-cell" id="draftParesCell${idx}"><span class="qc-pares-num">${t.pares}</span></td>
      <td><input class="qc-price-input" id="draftPriceInput${idx}" type="number" step="0.01" min="0" value="${row.price===0&&row.returnFlag?'0':(row.price||'')}" placeholder="—" oninput="draftGridSetPrice(${idx}, this.value)"></td>
      <td><input class="qc-price-input" type="number" step="0.01" min="0" max="100" value="${row.itemDiscount||0}" style="width:58px;" ${row.returnFlag?'disabled title="En una reposición no aplica descuento"':''} oninput="draftGridSetDiscount(${idx}, this.value)"></td>
      <td class="qc-subtotal-cell" id="draftSubCell${idx}">${money(t.subtotal)}</td>
      <td style="text-align:center;"><input type="checkbox" ${row.returnFlag?'checked':''} onchange="draftGridToggleReturn(${idx}, this.checked)" title="Devolución o defectuoso: se repone el par sin costo (el importe se puede escribir a mano)"></td>
      <td>${window._draftGridRows.length>1 ? `<button class="btn ghost sm" onclick="removeDraftGridRow(${idx})">✕</button>` : ''}</td>
    </tr>`;
  }).join('');
  const scroll = document.getElementById('draftGridScroll');
  const botones = document.getElementById('draftGridScrollBtns');
  if(scroll && botones) botones.style.display = (scroll.scrollWidth > scroll.clientWidth + 4) ? 'flex' : 'none';
  updateDraftTotal();
}
function updateDraftTotal(){
  const disc = Number(document.getElementById('f_odiscount')?.value || 0);
  const iva = document.getElementById('f_oiva')?.checked;
  const sub = (window._draftGridRows||[]).reduce((s,row)=>s+draftRowTotals(row).subtotal,0);
  let total = Math.max(sub - sub*(disc/100), 0);
  if(iva) total = total * 1.16;
  const el = document.getElementById('draftTotal');
  if(el) el.textContent = money(total) + (iva ? ' (IVA incl., sin contar envío)' : '');
}

async function saveOrder(existingId){
  if(!window._draftClientId){
    const typed = (document.getElementById('f_oclient').value||'').trim().toLowerCase();
    const exact = DB.clients.find(c=>c.active!==false && c.name.trim().toLowerCase()===typed);
    if(exact){ window._draftClientId = exact.id; updateDraftClientStatus(); }
  }
  if(!window._draftClientId){ showToast('Selecciona un cliente de la lista.'); return; }

  const sizes = window._draftGridSizes || SHOE_SIZES;
  const items = [];
  for(const row of window._draftGridRows){
    const activeSizes = sizes.filter(sz=>Number(row.sizes[sz])>0);
    if(!activeSizes.length || !row.modelText.trim()) continue;
    const modelId = row.modelId || await resolveOrCreateModel(row.modelText, row.price);
    for(const sz of activeSizes){
      items.push({
        modelId, color: row.color, size: sz,
        qty: Number(row.sizes[sz]),
        price: Number(row.price)||0,
        itemDiscount: Number(row.itemDiscount)||0,
        ...(row.meta && row.meta[sz] ? row.meta[sz] : {}),
        // La casilla de Devolución/Reposición de AHORA siempre manda sobre
        // lo que traía el renglón antes de abrir para editar — si no, marcar
        // o desmarcar la casilla durante la edición no se hubiera guardado.
        isReturn: !!row.returnFlag,
      });
    }
  }
  if(!items.length){ showToast('Agrega al menos un modelo con cantidad en alguna talla.'); return; }

  // Comprobación de errores antes de guardar: no bloquea el guardado (puede
  // ser intencional), pero avisa con claridad para que no se capture algo
  // por accidente.
  const itemsSinPrecio = items.filter(it=>Number(it.price)<=0);
  if(itemsSinPrecio.length){
    const nombres = Array.from(new Set(itemsSinPrecio.map(it=>modelName(it.modelId)))).join(', ');
    if(!confirm(`⚠ Hay ${itemsSinPrecio.length} renglón(es) con precio en $0.00 (${nombres}).\n\n¿Seguro que quieres guardar el pedido así?`)) return;
  }
  const cantidadAlta = items.find(it=>Number(it.qty)>30);
  if(cantidadAlta){
    if(!confirm(`⚠ Hay una cantidad muy alta capturada (${cantidadAlta.qty} pares en una sola talla de "${modelName(cantidadAlta.modelId)}"). Revisa que no sea un error de captura.\n\n¿Continuar de todos modos?`)) return;
  }
  const discount = Number(document.getElementById('f_odiscount').value)||0;
  const ivaApplied = document.getElementById('f_oiva').checked;
  const date = document.getElementById('f_odate').value || todayStr();
  const notes = document.getElementById('f_onotes').value.trim();

  let folio, savedOrderId;
  if(existingId){
    const o = DB.orders.find(x=>x.id===existingId);
    const versions = [...(o.versions||[]), { snapshot: JSON.parse(JSON.stringify({items:o.items, discount:o.discount, notes:o.notes, date:o.date, ivaApplied:o.ivaApplied})), savedAt: new Date().toISOString() }];
    const patch = { ...o, items, discount, date, notes, clientId: window._draftClientId, ivaApplied, versions };
    const ok = await updateOrderInSupabase(existingId, patch);
    if(!ok) return;
    Object.assign(o, { items, discount, date, notes, clientId: window._draftClientId, ivaApplied, versions });
    folio = o.folio;
    savedOrderId = o.id;
    await logAction('editar', 'pedido', folio, null, o);
  } else {
    const nuevo = await insertOrderToSupabase({ clientId: window._draftClientId, date, items, discount, ivaApplied, notes });
    if(!nuevo) return;
    DB.orders.push(nuevo);
    folio = nuevo.folio;
    savedOrderId = nuevo.id;
    await logAction('crear', 'pedido', folio, null, nuevo);
  }
  closeModal();
  render();
  showOrderConfirmLegend(savedOrderId, folio);
}

function copyOrderConfirmLegend(){
  const done = ()=> showToast('Leyenda copiada.');
  if(navigator.clipboard && navigator.clipboard.writeText){

      showToast('No se pudo copiar automáticamente; selecciona el texto manualmente.');
    });
  } else {
    showToast('No se pudo copiar automáticamente; selecciona el texto manualmente.');
  }
}

      </div>
